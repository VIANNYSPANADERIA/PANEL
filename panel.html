<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIANNYS PANADERIA · Panel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥐</text></svg>">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">V</div>
      <div>
        <div class="brand-name">VIANNYS</div>
        <div class="brand-sub">Panadería</div>
      </div>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-tab-target="clientes" data-testid="nav-clientes"><span class="ico">👥</span> Clientes</button>
      <button class="nav-item" data-tab-target="pedidos" data-testid="nav-pedidos"><span class="ico">🧾</span> Pedidos</button>
      <button class="nav-item" data-tab-target="productos" data-testid="nav-productos"><span class="ico">🥐</span> Productos</button>
      <button class="nav-item" data-tab-target="cartera" data-testid="nav-cartera"><span class="ico">💼</span> Cartera</button>
      <button class="nav-item" data-tab-target="recaudo" data-testid="nav-recaudo"><span class="ico">💵</span> Recaudo</button>
      <button class="nav-item" data-tab-target="estadisticas" data-testid="nav-estadisticas"><span class="ico">📊</span> Estadísticas</button>
      <div class="nav-section">Personal</div>
      <button class="nav-item" data-tab-target="nomina" data-testid="nav-nomina"><span class="ico">👷</span> Nómina</button>
      <div class="nav-section">Finanzas</div>
      <button class="nav-item" data-tab-target="flujo" data-testid="nav-flujo"><span class="ico">💹</span> Flujo de Caja</button>
      <a class="nav-item" href="/contabilidad.html" data-testid="nav-contabilidad"><span class="ico">📒</span> Contabilidad</a>
      <div class="nav-section">Sistema</div>
      <button class="nav-item" data-tab-target="sync" data-testid="nav-sync"><span class="ico">🔄</span> Sincronización</button>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="btn btn-ghost menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')" data-testid="menu-btn">☰</button>
        <h1 id="page-title">Clientes</h1>
      </div>
      <div class="topbar-actions">
        <span class="conn-badge" id="conn-badge" data-testid="conn-badge"><span class="conn-dot"></span> En línea</span>
        <button class="btn btn-ghost btn-icon" onclick="window.toggleTheme()" data-testid="theme-toggle">🌙</button>
      </div>
    </header>

    <div class="content">
      <section class="tab-panel active" data-tab="clientes" data-testid="panel-clientes"></section>
      <section class="tab-panel" data-tab="pedidos" data-testid="panel-pedidos"></section>
      <section class="tab-panel" data-tab="productos" data-testid="panel-productos"></section>
      <section class="tab-panel" data-tab="cartera" data-testid="panel-cartera"></section>
      <section class="tab-panel" data-tab="recaudo" data-testid="panel-recaudo"></section>
      <section class="tab-panel" data-tab="estadisticas" data-testid="panel-estadisticas"></section>
      <section class="tab-panel" data-tab="nomina" data-testid="panel-nomina"></section>
      <section class="tab-panel" data-tab="flujo" data-testid="panel-flujo"></section>
      <section class="tab-panel" data-tab="sync" data-testid="panel-sync"></section>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/modules/clientes.js"></script>
<script src="/js/modules/productos.js"></script>
<script src="/js/modules/pedidos.js"></script>
<script src="/js/modules/tickets.js"></script>
<script src="/js/modules/cartera.js"></script>
<script src="/js/modules/recaudo.js"></script>
<script src="/js/modules/nomina.js"></script>
<script src="/js/modules/flujo_caja.js"></script>
<script src="/js/modules/estadisticas.js"></script>
<script src="/js/modules/sync.js"></script>
<script src="/js/panel.js"></script>
</body>
</html>
