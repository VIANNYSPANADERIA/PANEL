<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIANNYS PANADERIA · Contabilidad</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📒</text></svg>">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">V</div>
      <div>
        <div class="brand-name">VIANNYS</div>
        <div class="brand-sub">Contabilidad</div>
      </div>
    </div>
    <nav class="nav">
      <a class="nav-item" href="/panel.html" data-testid="nav-back-panel"><span class="ico">←</span> Volver al Panel</a>
      <div class="nav-section">Contabilidad</div>
      <button class="nav-item active" data-tab-target="resumen" data-testid="nav-resumen"><span class="ico">📋</span> Resumen</button>
      <button class="nav-item" data-tab-target="registrar" data-testid="nav-registrar"><span class="ico">➕</span> Registrar</button>
      <button class="nav-item" data-tab-target="historial" data-testid="nav-historial"><span class="ico">📜</span> Historial</button>
      <button class="nav-item" data-tab-target="flujo-caja" data-testid="nav-flujo-caja"><span class="ico">💹</span> Flujo de Caja</button>
      <button class="nav-item" data-tab-target="categorias" data-testid="nav-categorias"><span class="ico">🏷️</span> Categorías</button>
      <button class="nav-item" data-tab-target="dashboards" data-testid="nav-dashboards"><span class="ico">📊</span> Dashboards</button>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="btn btn-ghost menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')" data-testid="menu-btn">☰</button>
        <h1 id="page-title">Resumen</h1>
      </div>
      <div class="topbar-actions">
        <span class="conn-badge" id="conn-badge" data-testid="conn-badge"><span class="conn-dot"></span> En línea</span>
        <button class="btn btn-ghost btn-icon" onclick="window.toggleTheme()" data-testid="theme-toggle">🌙</button>
      </div>
    </header>

    <div class="content">
      <section class="tab-panel active" data-tab="resumen" data-testid="panel-resumen"></section>
      <section class="tab-panel" data-tab="registrar" data-testid="panel-registrar"></section>
      <section class="tab-panel" data-tab="historial" data-testid="panel-historial"></section>
      <section class="tab-panel" data-tab="flujo-caja" data-testid="panel-flujo-caja"></section>
      <section class="tab-panel" data-tab="categorias" data-testid="panel-categorias"></section>
      <section class="tab-panel" data-tab="dashboards" data-testid="panel-dashboards"></section>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/contabilidad.js"></script>
</body>
</html>
