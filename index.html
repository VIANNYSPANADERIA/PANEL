const CuentasModule = (() => {
  const repo = Services.repos.cuentas;
  const trRepo = Services.repos.transferencias;
  const SCHEMA = {
    grid: 2, fields: [
      { name: 'id', type: 'hidden' },
      { name: 'nombre', label: 'Nombre de cuenta', required: true, span: 2 },
      { name: 'banco', label: 'Banco' },
      { name: 'tipo', label: 'Tipo', type: 'select', options: ['Ahorros','Corriente','Nequi','Daviplata'].map(t => ({ value: t, label: t })) },
      { name: 'numero', label: 'Número de cuenta' },
      { name: 'saldo_inicial', label: 'Saldo inicial (COP)', type: 'number' },
      { name: 'estado', label: 'Estado', type: 'select', options: [{ value: 'activa', label: 'Activa' }, { value: 'inactiva', label: 'Inactiva' }] },
    ],
  };
  const columns = [
    { key: 'nombre', label: 'Cuenta', render: (v, r) => `<div><b>${v}</b><div class="muted">${r.banco || ''} · ${r.numero || ''}</div></div>` },
    { key: 'banco', label: 'Banco' },
    { key: 'tipo', label: 'Tipo', render: v => `<span class="badge badge--info">${v}</span>` },
    { key: 'saldo', label: 'Saldo', align: 'right', get: r => Utils.money(r.saldo ?? r.saldo_inicial), render: v => `<span class="num bold">${v}</span>` },
    { key: 'estado', label: 'Estado', render: v => `<span class="badge badge--${v === 'activa' ? 'success' : 'muted'}">${v}</span>` },
    { key: '_a', label: 'Acciones', render: () => `<button class="btn btn--ghost btn--sm" data-act="edit">Editar</button> <button class="btn btn--ghost btn--sm" data-act="transfer">Transferir</button> <button class="btn btn--ghost btn--sm" data-act="hist">Historial</button> <button class="btn btn--danger btn--sm" data-act="del">Eliminar</button>` },
  ];
  return CrudPage.build({
    repo, title: 'Cuentas Bancarias', schema: SCHEMA, columns,
    newButton: 'Nueva Cuenta', searchPlaceholder: 'Buscar cuentas…',
    kpis: rows => [
      KpiCard.build({ icon: 'account_balance', label: 'Total cuentas', value: rows.length, variant: 'primary' }),
      KpiCard.build({ icon: 'monetization_on', label: 'Saldo total', value: Utils.money(rows.reduce((s, r) => s + (+r.saldo || 0), 0)), variant: 'filled' }),
      KpiCard.build({ icon: 'check_circle', label: 'Activas', value: rows.filter(r => r.estado === 'activa').length, variant: 'tertiary' }),
      KpiCard.build({ icon: 'sync_alt', label: 'Transferencias', value: rows.length, variant: 'secondary', sub: 'Cuenta/s' }),
    ],
    onAction: async (act, row) => {
      if (act === 'transfer') return transfer(row);
      if (act === 'hist') return historial(row);
    },
  });

  function transfer(cuenta) {
    if (!Auth.can('cuentas', 'transferir')) return Toast.error('Sin permisos');
    const body = `<div class="field"><label>Cuenta destino</label><select name="destino_id" id="tr-dest"></select></div>
      <div class="field"><label>Valor</label><input type="number" name="valor" min="1" required/></div>
      <div class="field"><label>Descripción</label><input type="text" name="descripcion"/></div>`;
    Modal.open({ title: `Transferir desde ${cuenta.nombre}`, body, footer: `<button class="btn btn--ghost" data-close>Cancelar</button><button class="btn btn--primary" id="tr-ok">Transferir</button>` });
    Services.repos.cuentas.list().then(cs => {
      const sel = document.querySelector('#tr-dest');
      sel.innerHTML = cs.filter(c => c.id !== cuenta.id).map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
    });
    document.querySelector('#tr-ok').addEventListener('click', async () => {
      const raw = Form.collect(document.querySelector('.modal__body'));
      try {
        await Services.call('cuentas.transferir', { origen_id: cuenta.id, ...raw, usuario: Auth.getCurrentUser() });
        Modal.close(); Toast.success('Transferencia realizada');
        EventBus.emit('repo:cuentas_bancarias:invalidate');
      } catch (e) { Toast.error('Transferencia: ' + e.message); }
    });
  }
  async function historial(cuenta) {
    try {
      const list = await trRepo.list({ cuenta_id: cuenta.id });
      Modal.open({
        title: `Historial de transferencias — ${cuenta.nombre}`,
        body: `<table class="data"><thead><tr><th>Fecha</th><th>Destino</th><th class="right">Valor</th><th class="right">Saldo</th></tr></thead>
          <tbody>${(list || []).map(t => `<tr><td>${Utils.date(t.fecha)}</td><td>${t.destino || ''}</td><td class="num">${Utils.money(t.valor)}</td><td class="num">${Utils.money(t.saldo)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Sin transferencias</td></tr>'}</tbody></table>`,
        footer: `<button class="btn btn--ghost" data-close>Cerrar</button>`,
      });
    } catch (e) { Toast.error('Historial: ' + e.message); }
  }
})();

    }));

    const now = new Date();

    const host = document.querySelector('#rep-table'); host.innerHTML = '<div class="skeleton" style="height:80px"></div>';
    try {
      const r = await Services.call('reportes.generar', { tipo, desde: document.querySelector('#rep-from').value, hasta: document.querySelector('#rep-to').value });
      renderK(r?.data || {});
      host.innerHTML = `<table class="data"><thead><tr><th>Periodo</th><th>Métrica</th><th class="right">Valor</th></tr></thead><tbody>${(r?.data?.rows||[]).map(x => `<tr><td>${x.periodo}</td><td>${x.metrica}</td><td class="num">${Utils.money(x.valor)}</td></tr>`).join('') || '<tr><td colspan="3" class="empty">Sin datos</td></tr>'}</tbody></table>`;
    } catch (e) { Toast.error('Reporte: ' + e.message); host.innerHTML = ''; }
  }
  function renderK(d) {
    const k = d.kpis || {};
    document.querySelector('#rep-kpis').innerHTML = Object.entries(k).map(([l, v]) => KpiCard.build({ icon: 'analytics', label: l, value: typeof v === 'number' ? Utils.money(v) : v, variant: 'primary' })).join('') || '<div class="muted">Sin KPIs</div>';
  }
  async function exportExcel() {
    try {
      const rows = document.querySelectorAll('#rep-table tbody tr');
      if (!rows.length) return Toast.info('Genera primero un reporte');
      const csv = Utils.toCSV([...rows].map(tr => ({ periodo: tr.children[0].textContent, metrica: tr.children[1].textContent, valor: tr.children[2].textContent })),
        [{ key: 'periodo', label: 'Periodo' }, { key: 'metrica', label: 'Métrica' }, { key: 'valor', label: 'Valor' }]);
      Utils.download('reporte_' + Utils.todayKey() + '.csv', csv, 'text/csv');
      Toast.success('Exportado a CSV (excel compatible)');
    } catch (e) { Toast.error('Exportar: ' + e.message); }
  }
  return { render };
})();

/**
 * configuracion.js — Usuarios, Roles, Permisos, Preferencias + Datos fiscales de facturación.
 */
const ConfiguracionModule = (() => {
  function render(container) {
    container.innerHTML = `
      <div class="page-head"><div><h1>Configuración</h1><div class="subtitle">Usuarios · Roles · Preferencias</div></div></div>
      <div class="flex" style="gap:8px;margin-bottom:var(--s-lg)">${['usuarios','roles','permisos','preferencias','facturacion'].map((t,i)=>`<button class="chip ${i===0?'is-active':''}" data-tab="${t}">${t.charAt(0).toUpperCase()+t.slice(1)}</button>`).join('')}</div>
      <div id="config-body"></div>`;
    container.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
      container.querySelectorAll('[data-tab]').forEach(x => x.classList.remove('is-active')); b.classList.add('is-active');
      TABS[b.dataset.tab]();
    }));
    TABS.usuarios();
  }
  let table;
  const TABS = {
    async usuarios() {
      const body = document.querySelector('#config-body');
      body.innerHTML = `<div class="flex-between mb"><button class="btn btn--primary" id="cfg-new-user"><span class="ms">add</span> Nuevo usuario</button></div><div id="cfg-users-table"></div>`;
      table = DataTable.build({ mount: body.querySelector('#cfg-users-table'), loading: true, columns: [
        { key: 'nombre', label: 'Nombre' },
        { key: 'usuario', label: 'Usuario', render: v => `<span class="font-code-mono">${v}</span>` },
        { key: 'email', label: 'Email' },
        { key: 'rol', label: 'Rol', render: v => `<span class="badge badge--info">${v}</span>` },
        { key: 'estado', label: 'Estado', render: v => `<span class="badge badge--${v==='activo'?'success':'muted'}">${v}</span>` },
        { key: '_a', label: '', render: () => `<button class="btn btn--ghost btn--sm" data-act="edit">Editar</button> <button class="btn btn--danger btn--sm" data-act="del">Eliminar</button>` },
      ], onRowClick: () => {} });
      try { const rows = await Services.repos.usuarios.list(); table.setRows(rows); table.setLoading(false); }
      catch (e) { Toast.error('Usuarios: ' + e.message); table.setLoading(false); }
      body.querySelector('#cfg-new-user').addEventListener('click', () => userForm());
      body.querySelector('#cfg-users-table').addEventListener('click', async (e) => {
        const b = e.target.closest('[data-act]'); if (!b) return; const id = b.closest('tr')?.dataset.id; if (!id) return;
        if (b.dataset.act === 'edit') { try { const all = await Services.repos.usuarios.list({ useCache:false }); const u = all.find(x=>String(x.id)===String(id)); if (u) userForm(u); } catch (_) {} }
        else if (b.dataset.act === 'del') { const ok = await Modal.confirm({ title:'Eliminar usuario', message:'¿Eliminar este usuario?', danger:true, confirmText:'Eliminar' }); if (!ok) return; try { await Services.repos.usuarios.remove(id); Toast.success('Eliminado'); TABS.usuarios(); } catch (e) { Toast.error(e.message); } }
      });
    },
    roles() {
      const body = document.querySelector('#config-body');
      const rows = Object.entries(PERMISSIONS.ROLES).map(([r, perms]) => `<tr>
        <td><b>${r}</b></td><td>${Object.keys(perms).length} módulos</td>
        <td>${Object.entries(perms).filter(([,a])=>a.includes('create')||a.includes('update')||a.includes('delete')).map(([m])=>m).join(', ')||'—'}</td>
        <td><button class="btn btn--ghost btn--sm" data-role="${r}">Ver</button></td></tr>`).join('');
      body.innerHTML = `<table class="data"><thead><tr><th>Rol</th><th>Alcance</th><th>Permisos de escritura</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
      body.querySelectorAll('[data-role]').forEach(b => b.addEventListener('click', () => {
        const p = PERMISSIONS.ROLES[b.dataset.role];
        const body2 = Object.entries(p).map(([m, acts]) => `<div class="flex-between" style="padding:6px 0;border-bottom:1px solid var(--outline-variant)"><b>${m}</b><span>${acts.join(', ')}</span></div>`).join('');
        Modal.open({ title: `Permisos rol: ${b.dataset.role}`, body: body2, footer: `<button class="btn btn--ghost" data-close>Cerrar</button>` });
      }));
    },
    permisos() { TABS.roles(); },
    preferencias() {
      const body = document.querySelector('#config-body');
      const c = CONFIG.COMPANY_DEFAULTS;
      body.innerHTML = `<div class="card" style="padding:var(--s-lg)"><div class="card__title">Preferencias de la empresa</div>
        <div class="grid-form mt-md">
          <div class="field"><label>Nombre de la empresa</label><input id="pf-nombre" value="${c.razon_social}"/></div>
          <div class="field"><label>NIT</label><input id="pf-nit" value="${c.nit}"/></div>
          <div class="field"><label>Teléfono</label><input id="pf-tel" value="${c.telefono}"/></div>
          <div class="field"><label>Dirección</label><input id="pf-dir" value="${c.direccion}"/></div>
        </div><button class="btn btn--primary mt-md" id="pf-save">Guardar</button></div>`;
      body.querySelector('#pf-save').addEventListener('click', async () => {
        const data = { nombre: body.querySelector('#pf-nombre').value, nit: body.querySelector('#pf-nit').value, telefono: body.querySelector('#pf-tel').value, direccion: body.querySelector('#pf-dir').value };
        try { await Services.repos.config.update('empresa', data); Toast.success('Preferencias guardadas'); }
        catch (e) { Toast.error('Guardar: ' + e.message); }
      });
    },
    facturacion() {
      const body = document.querySelector('#config-body');
      body.innerHTML = `<div class="card" style="padding:var(--s-lg)"><div class="card__title">Datos fiscales de facturación</div>
        <div class="grid-form mt-md">
          <div class="field"><label>Razón Social</label><input id="fc-razon"/></div>
          <div class="field"><label>NIT/RUT</label><input id="fc-nit"/></div>
          <div class="field" style="grid-column:span 2"><label>Resolución DIAN</label><textarea id="fc-res"></textarea></div>
          <div class="field"><label>Dirección</label><input id="fc-dir"/></div>
          <div class="field"><label>Teléfono</label><input id="fc-tel"/></div>
        </div><div class="bg-surface-container-low" style="font-family:var(--font-mono);padding:16px;border-radius:var(--r-md);margin-top:var(--s-lg);max-width:320px"><b id="pv-razon"></b><br/>NIT: <span id="pv-nit"></span><br/>Tel: <span id="pv-tel"></span></div>
        <button class="btn btn--primary mt-md" id="fc-save">Guardar</button></div>`;
      ['razon','nit','tel','dir'].forEach(k => { const el = body.querySelector('#fc-' + (k==='tel'?'tel':k)); el?.addEventListener('input', () => body.querySelector('#pv-' + (k==='razon'?'razon':k==='dir'?'dir':k)).textContent = el.value); });
      body.querySelector('#fc-save').addEventListener('click', async () => {
        const data = { razon_social: body.querySelector('#fc-razon').value, nit: body.querySelector('#fc-nit').value, resolucion: body.querySelector('#fc-res').value, direccion: body.querySelector('#fc-dir').value, telefono: body.querySelector('#fc-tel').value };
        try { await Services.repos.config.update('facturacion', data); Toast.success('Datos guardados'); } catch (e) { Toast.error(e.message); }
      });
    },
  };
  function userForm(u = {}) {
    const body = Form.build({ grid: 2, fields: [
      { name: 'id', type: 'hidden' },
      { name: 'nombre', label: 'Nombre', required: true, span: 2 },
      { name: 'usuario', label: 'Usuario', required: true },
      { name: 'email', label: 'Email', type: 'email' },
      { name: 'password', label: u.id ? 'Nueva contraseña (opcional)' : 'Contraseña', type: 'password' },
      { name: 'rol', label: 'Rol', type: 'select', options: Object.keys(PERMISSIONS.ROLES).map(r => ({ value: r, label: r })) },
      { name: 'estado', label: 'Estado', type: 'select', options: [{ value: 'activo', label: 'Activo' }, { value: 'inactivo', label: 'Inactivo' }] },
    ]}, u);
    Modal.open({ title: u.id ? 'Editar usuario' : 'Nuevo usuario', body, footer: `<button class="btn btn--ghost" data-close>Cancelar</button><button class="btn btn--primary" id="us-ok">Guardar</button>` });
    document.querySelector('#us-ok').addEventListener('click', async () => {
      const raw = Form.collect(document.querySelector('.modal__body'));
      try { if (raw.id) { await Services.repos.usuarios.update(raw.id, raw); } else { await Services.repos.usuarios.create(raw); } Modal.close(); Toast.success('Guardado'); TABS.usuarios(); }
      catch (e) { Toast.error('Guardar: ' + e.message); }
    });
  }
  return { render };
})();

// ===== js\app.js =====
/**
 * app.js — bootstrap: registro de rutas, montaje de shell, arranque.
 * SIN LOGIN: entra directo al dashboard.
 */
(function bootstrap() {
  'use strict';
  document.addEventListener('DOMContentLoaded', init);

  async function init() {
    Auth.init(); // Auto-login como admin
    Sidebar.mount(document.querySelector('.app-shell'));
    Header.mount(document.querySelector('.main'));
    const view = document.getElementById('app-view');
    Router.init(view, guard);

    // Registrar todas las rutas
    Router.register('dashboard', () => Promise.resolve(DashboardModule));
    Router.register('clientes', () => Promise.resolve(ClientesModule));
    Router.register('pedidos', () => Promise.resolve(PedidosModule));
    Router.register('produccion', () => Promise.resolve(ProduccionModule));
    Router.register('inventario', () => Promise.resolve(InventarioModule));
    Router.register('compras', () => Promise.resolve(ComprasModule));
    Router.register('recaudos', () => Promise.resolve(RecaudosModule));
    Router.register('caja', () => Promise.resolve(CajaModule));
    Router.register('cuentas', () => Promise.resolve(CuentasModule));
    Router.register('gastos', () => Promise.resolve(GastosModule));
    Router.register('reportes', () => Promise.resolve(ReportesModule));
    Router.register('logistica', () => Promise.resolve(LogisticaModule));
    Router.register('configuracion', () => Promise.resolve(ConfiguracionModule));
    Router.register('auditoria', () => Promise.resolve(AuditoriaModule));

    EventBus.on('route:before', ({ path }) => Audit.log('nav', 'view', { path }));
    startPolling();

    // Entrar directo al dashboard
    if (!location.hash || location.hash === '#/login') Router.navigate('dashboard');
    else Router.render();
  }

  function guard(path) { return true; } // Sin restricciones

  function startPolling() {
    let t;
    const tick = async () => {
      try { const m = await Services.meta().catch(() => null); if (m && m.data) EventBus.emit('sync:tick', m.data); } catch (_) {}
      t = setTimeout(tick, CONFIG.POLLING_INTERVAL);
    };
    t = setTimeout(tick, CONFIG.POLLING_INTERVAL);
    window.addEventListener('beforeunload', () => clearTimeout(t));
  }
})();
  </script>
