<!doctype html>
<html lang="es" class="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ERP Panadería - Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.2/dist/pocketbase.umd.js"></script>
  <script src="pocketbaseConfig.js"></script>
  <script src="pocketbaseService.js"></script>
  <style>
:root{
  --primary:#3525cd;--on-primary:#fff;--primary-container:#4f46e5;--on-primary-container:#dad7ff;
  --primary-fixed:#e2dfff;--primary-fixed-dim:#c3c0ff;
  --secondary:#904d00;--on-secondary:#fff;--secondary-container:#fe932c;--on-secondary-container:#663500;
  --secondary-fixed:#ffdcc3;--secondary-fixed-dim:#ffb77d;
  --tertiary:#005338;--on-tertiary:#fff;--tertiary-container:#006e4b;--on-tertiary-container:#67f4b7;
  --tertiary-fixed:#6ffbbe;--tertiary-fixed-dim:#4edea3;
  --error:#ba1a1a;--on-error:#fff;--error-container:#ffdad6;--on-error-container:#93000a;
  --background:#f9f9ff;--on-background:#151c27;--surface:#f9f9ff;--on-surface:#151c27;
  --on-surface-variant:#464555;--surface-variant:#dce2f3;
  --surface-container-lowest:#fff;--surface-container-low:#f0f3ff;--surface-container:#e7eefe;
  --surface-container-high:#e2e8f8;--surface-container-highest:#dce2f3;
  --outline:#777587;--outline-variant:#c7c4d8;
  --inverse-surface:#2a313d;--inverse-on-surface:#ebf1ff;
  --nequi:#d6006e;--bancolombia:#ffdd00;--bancolombia-blue:#004b98;
  --r-sm:.125rem;--r-default:.25rem;--r-md:.375rem;--r-lg:.5rem;--r-xl:.75rem;--r-2xl:1rem;--r-full:9999px;
  --s-xs:4px;--s-sm:8px;--s-md:16px;--s-lg:24px;--s-xl:40px;
  --container-max:1440px;--sidebar-width:240px;--header-h:60px;
  --font-sans:'Geist','Inter',system-ui,-apple-system,sans-serif;--font-mono:'Geist Mono',ui-monospace,monospace;
  --shadow-card:0 1px 2px rgba(21,28,39,.04);--shadow-pop:0 8px 24px rgba(0,0,0,.12);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font-sans);background:var(--background);color:var(--on-surface);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0}a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.ms{font-family:'Material Symbols Outlined';font-size:20px;line-height:1;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.app-shell{display:flex;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;width:var(--sidebar-width);height:100vh;background:var(--surface-container-lowest);border-right:1px solid var(--outline-variant);display:flex;flex-direction:column;padding:var(--s-md);z-index:50;overflow-y:auto}
.main{margin-left:var(--sidebar-width);flex:1;min-width:0;display:flex;flex-direction:column}
.header{position:sticky;top:0;z-index:40;height:var(--header-h);background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--outline-variant);padding:0 var(--s-lg);display:flex;align-items:center;gap:var(--s-md)}
.content{padding:var(--s-lg);max-width:var(--container-max);width:100%;margin:0 auto}
.sb-brand{display:flex;align-items:center;gap:var(--s-sm);padding:var(--s-sm) var(--s-xs);margin-bottom:var(--s-md)}
.sb-brand-ico{width:38px;height:38px;border-radius:var(--r-lg);background:var(--primary-container);color:var(--on-primary);display:grid;place-items:center}
.sb-brand-t{font-size:17px;font-weight:700;line-height:20px}
.sb-brand-s{font-size:11px;color:var(--on-surface-variant)}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{display:flex;align-items:center;gap:var(--s-md);padding:9px var(--s-md);border-radius:var(--r-lg);color:var(--on-surface-variant);font-size:13px;font-weight:500;cursor:pointer;user-select:none;border-left:4px solid transparent;transition:background .2s,color .2s}
.nav-item:hover{background:var(--surface-container-high)}
.nav-item.active{color:var(--primary);font-weight:700;background:var(--surface-container-low);border-left-color:var(--primary);border-radius:0 var(--r-lg) var(--r-lg) 0}
.nav-item.active .ms{font-variation-settings:'FILL' 1}
.h-t{font-size:19px;font-weight:700;color:var(--primary);white-space:nowrap}
.h-spacer{flex:1}
.search{position:relative;display:flex;align-items:center}
.search input{background:var(--surface-container-low);border:1px solid var(--outline-variant);border-radius:var(--r-full);padding:8px 12px 8px 36px;font-size:14px;color:var(--on-surface);outline:none;width:300px}
.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(53,37,205,.12)}
.search .ms{position:absolute;left:10px;color:var(--on-surface-variant);font-size:20px;pointer-events:none}
.icon-btn{width:38px;height:38px;border-radius:var(--r-lg);background:transparent;border:none;color:var(--on-surface-variant);display:grid;place-items:center;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--surface-container-low);color:var(--primary)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:600;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;padding:8px 16px;border-radius:var(--r-lg);font-weight:600;font-size:14px;border:1px solid transparent;transition:transform .12s,background .15s,opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:var(--on-primary);box-shadow:0 4px 12px rgba(53,37,205,.2)}
.btn-primary:hover{background:#2d1fbb}
.btn-secondary{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn-tertiary{background:var(--tertiary-container);color:var(--on-tertiary)}
.btn-ghost{background:var(--surface-container-lowest);border-color:var(--outline-variant);color:var(--on-surface)}
.btn-ghost:hover{background:var(--surface-container)}
.btn-danger{background:transparent;color:var(--error);border-color:var(--error-container)}
.btn-danger:hover{background:var(--error-container)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface-container-lowest);border:1px solid var(--outline-variant);border-radius:var(--r-xl);box-shadow:var(--shadow-card)}
.card-h{padding:var(--s-md);border-bottom:1px solid var(--outline-variant);display:flex;align-items:center;gap:var(--s-sm)}
.card-b{padding:var(--s-md)}
.card-t{font-size:16px;font-weight:600}
.kpi{background:var(--surface-container-lowest);border:1px solid var(--outline-variant);border-radius:var(--r-xl);padding:var(--s-md);position:relative}
.kpi-ico{width:38px;height:38px;border-radius:var(--r-lg);display:grid;place-items:center}
.kpi-ico-p{background:var(--primary-fixed);color:var(--primary)}
.kpi-ico-s{background:var(--secondary-fixed);color:var(--secondary)}
.kpi-ico-t{background:var(--tertiary-fixed);color:var(--tertiary)}
.kpi-ico-e{background:var(--error-container);color:var(--error)}
.kpi-l{font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--on-surface-variant);margin-top:6px}
.kpi-v{font-size:22px;font-weight:700;margin-top:2px;font-family:var(--font-mono)}
.kpi-fill{background:var(--primary);color:var(--on-primary);border-color:transparent}
.kpi-fill .kpi-l,.kpi-fill .kpi-ico{color:var(--on-primary)}
.kpi-fill .kpi-ico{background:rgba(255,255,255,.18)}
.tw{background:var(--surface-container-lowest);border:1px solid var(--outline-variant);border-radius:var(--r-xl);overflow:hidden;overflow-x:auto}
/* Tabla de recaudo: scroll vertical interno para que el sticky header funcione. */
.tw.rec-tw{max-height:62vh;overflow-y:auto;overflow-x:auto;border-radius:var(--r-xl)}
table.d{width:100%;border-collapse:collapse}
table.d>thead{background:var(--surface-container-low)}
table.d th{padding:8px var(--s-md);text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--on-surface-variant);white-space:nowrap}
/* Header pegajoso: sticky dentro del contenedor con overflow (funciona en .rec-tw). */
.rec-tw table.d>thead th{position:sticky;top:0;z-index:5;background:var(--surface-container);box-shadow:inset 0 -1px 0 var(--outline-variant)}
table.d td{padding:8px var(--s-md);border-top:1px solid var(--outline-variant);font-size:13px;vertical-align:middle}
table.d tr:hover td{background:var(--surface-container-low)}
.num{font-family:var(--font-mono);text-align:right}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:var(--r-sm);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.badge-success{background:var(--tertiary-fixed);color:var(--tertiary)}
.badge-info{background:var(--primary-fixed);color:var(--primary)}
.badge-warn{background:var(--secondary-fixed);color:var(--secondary)}
.badge-error{background:var(--error-container);color:var(--error)}
.badge-muted{background:var(--surface-container-high);color:var(--on-surface-variant)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:var(--s-md)}
.field label{font-size:12px;color:var(--on-surface-variant);font-weight:500}
.field input,.field select,.field textarea{background:var(--surface-container-low);border:1px solid var(--outline-variant);border-radius:var(--r-lg);padding:8px 12px;font-size:14px;color:var(--on-surface);outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(53,37,205,.12)}
.gf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-md)}
.gf3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gf4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:720px){.gf,.gf3,.gf4{grid-template-columns:1fr}}
.modal-bg{position:fixed;inset:0;background:rgba(21,28,39,.45);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:100;padding:var(--s-lg);animation:fade .15s}
.modal{background:var(--surface-container-lowest);border:1px solid var(--outline-variant);border-radius:var(--r-xl);box-shadow:var(--shadow-pop);width:min(560px,100%);max-height:90vh;display:flex;flex-direction:column}
.modal.lg{width:min(880px,100%)}
.modal-lg{width:min(880px,100%)}
.modal-h{padding:var(--s-md) var(--s-lg);border-bottom:1px solid var(--outline-variant);display:flex;align-items:center;gap:var(--s-sm)}
.modal-t{font-size:18px;font-weight:600;flex:1}
.modal-b{padding:var(--s-lg);overflow-y:auto}
.modal-f{padding:var(--s-md) var(--s-lg);border-top:1px solid var(--outline-variant);display:flex;gap:var(--s-sm);justify-content:flex-end}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast-wrap{position:fixed;right:var(--s-lg);bottom:var(--s-lg);display:flex;flex-direction:column;gap:var(--s-sm);z-index:200}
.toast{background:var(--inverse-surface);color:var(--inverse-on-surface);padding:var(--s-sm) var(--s-md);border-radius:var(--r-lg);font-size:13px;box-shadow:var(--shadow-pop);display:flex;align-items:center;gap:var(--s-sm);max-width:360px}
.toast-success{background:var(--tertiary);color:var(--on-tertiary)}
.toast-error{background:var(--error);color:var(--on-error)}
.empty{padding:var(--s-xl);text-align:center;color:var(--on-surface-variant)}
.ph{display:flex;align-items:center;gap:var(--s-sm);margin-bottom:var(--s-lg);flex-wrap:wrap}
.ph h1{font-size:26px;font-weight:700}
.ph .sub{color:var(--on-surface-variant);font-size:14px}
.grid{display:grid;gap:var(--s-md)}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:1024px){.grid-4,.grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}}
.muted{color:var(--on-surface-variant)}.bold{font-weight:700}.right{text-align:right}.center{text-align:center}
.flex{display:flex}.fb{display:flex;align-items:center;justify-content:space-between}.gap{gap:var(--s-md)}.gap-sm{gap:var(--s-sm)}
.mt-md{margin-top:var(--s-md)}.mt-lg{margin-top:var(--s-lg)}.mb-md{margin-bottom:var(--s-md)}
.is-hidden{display:none!important}
.fade-in{animation:fade .25s}
.is-hidden{display:none!important}
.cc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--s-md)}
.ccard{background:var(--surface-container-lowest);border:1px solid var(--outline-variant);border-radius:var(--r-xl);padding:var(--s-md);cursor:grab;transition:transform .12s,box-shadow .15s,border-color .15s,opacity .15s;position:relative;overflow:hidden}
.ccard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--card-color,var(--primary))}
.ccard:hover{transform:translateY(-2px);box-shadow:var(--shadow-pop);border-color:var(--primary)}
.ccard.dragging{opacity:.4;cursor:grabbing}
.ccard.drag-over{border-color:var(--primary);box-shadow:0 0 0 3px rgba(53,37,205,.2)}
.ccard-name{font-size:16px;font-weight:700;margin-bottom:6px;margin-left:8px}
.ccard-row{display:flex;justify-content:space-between;font-size:13px;margin-top:4px;margin-left:8px}
.ccard-del{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:transparent;border:none;color:var(--error);display:grid;place-items:center;opacity:0;transition:opacity .15s;z-index:3}
.ccard:hover .ccard-del{opacity:1}
.ccard-handle{position:absolute;top:8px;left:10px;color:var(--on-surface-variant);opacity:0;transition:opacity .15s;z-index:3}
.ccard:hover .ccard-handle{opacity:.6}
.ccard-dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--surface-container-lowest);box-shadow:0 0 0 1px var(--outline-variant);vertical-align:middle}
.swatches{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0}
.swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .12s,border-color .12s}
.swatch:hover{transform:scale(1.1)}
.swatch.selected{border-color:var(--on-surface)}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--s-md)}
.prod{background:var(--surface-container-lowest);border:1px solid var(--outline-variant);border-radius:var(--r-xl);padding:var(--s-md);display:flex;flex-direction:column;gap:8px;overflow:hidden;color:#000}
/* Caja de imagen blindada: relacion fija, recorte limpio, nunca se sale ni se deforma */
.prod-img{position:relative;width:100%;aspect-ratio:4/3;flex:0 0 auto;overflow:hidden;border-radius:var(--r-lg);background:var(--surface-container-high);display:grid;place-items:center;color:var(--on-surface-variant)}
.prod-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block;border-radius:inherit}
.prod-name{font-weight:800;font-size:14px;color:#000;line-height:1.25}
.prod-price{font-size:12.5px;font-weight:700;color:#000}
.prod-row{display:flex;flex-direction:column;gap:4px}
.prod-row label{font-size:11px;font-weight:700;color:#000}
.prod-row input{width:100%;padding:6px 8px;font-size:13px;font-weight:700;color:#000;border:2px solid var(--outline-variant);border-radius:var(--r-lg);background:var(--surface-container-low);outline:none;transition:border-color .15s,background .15s}
.prod-row input:focus{border-color:var(--primary)}
.prod-row input.has-value{border-color:#00897b;background:#e8f5e9;color:#1b5e20}
.prod.has-item{border:2.5px solid #00897b;background:#f0faf5}
.prod.has-item .prod-name{color:#1b5e20}
.prod .fb span{color:#000;font-weight:800}
.prod-exc{font-size:10.5px;font-weight:700;color:var(--primary)}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:var(--s-md)}
.chart-card{background:var(--surface-container-lowest);border:1px solid var(--outline-variant);border-radius:var(--r-xl);padding:var(--s-md);display:flex;flex-direction:column;min-width:0}
.chart-card h4{margin:0 0 2px;font-size:14px;font-weight:800;color:#000}
.chart-card .chart-sub{font-size:11px;color:var(--on-surface-variant);margin-bottom:10px}
.chart-box{position:relative;width:100%;height:260px}
.chart-empty{display:grid;place-items:center;height:260px;color:var(--on-surface-variant);font-size:13px}
.toggle{display:inline-flex;border:1px solid var(--outline-variant);border-radius:var(--r-full);padding:2px;gap:2px}
.toggle button{border:none;background:transparent;padding:6px 14px;border-radius:var(--r-full);font-size:12px;font-weight:600;color:var(--on-surface-variant)}
.toggle button.active{background:var(--primary);color:var(--on-primary)}
.fab{position:fixed;right:var(--s-lg);bottom:var(--s-lg);width:56px;height:56px;border-radius:50%;background:var(--primary);color:var(--on-primary);border:none;box-shadow:0 6px 16px rgba(53,37,205,.4);font-size:28px;display:grid;place-items:center;z-index:40}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;display:none;background:var(--surface-container-lowest);border-top:1px solid var(--outline-variant);padding:6px 0;z-index:60;justify-content:space-around}
.bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--on-surface-variant);background:none;border:none;padding:4px}
.bottom-nav button.active{color:var(--primary)}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}.main{margin-left:0}.bottom-nav{display:flex}.content{padding:var(--s-md);padding-bottom:80px}}
.ticket{width:80mm;font-family:var(--font-mono);color:#000;background:#fff;padding:4mm;font-size:11px;line-height:1.4}
.ticket-center{text-align:center}.ticket-right{text-align:right}.ticket-cut{border-top:1px dashed #000;margin:6px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{aspect-ratio:1;display:grid;place-items:center;border-radius:var(--r-md);border:1px solid var(--outline-variant);cursor:pointer;font-size:12px;background:var(--surface-container-lowest)}
.cal-day.worked{background:var(--tertiary);color:var(--on-tertiary);border-color:var(--tertiary);font-weight:700}
.cal-day.cal-head{background:transparent;border:none;cursor:default;font-weight:600;font-size:11px;color:var(--on-surface-variant)}
.seg{display:inline-flex;background:var(--surface-container-low);border:1px solid var(--outline-variant);border-radius:var(--r-full);padding:2px;gap:2px}
.seg button{border:none;background:transparent;padding:6px 14px;border-radius:var(--r-full);font-size:12px;font-weight:600;color:var(--on-surface-variant)}
.seg button.active{background:var(--primary);color:var(--on-primary)}
.drag-handle{cursor:grab;color:var(--on-surface-variant);font-size:20px}
.menu-tabs{display:flex;gap:4px;border-bottom:1px solid var(--outline-variant);margin-bottom:var(--s-lg);flex-wrap:wrap}
.menu-tab{padding:10px 16px;font-size:14px;font-weight:600;color:var(--on-surface-variant);border:none;background:transparent;border-bottom:3px solid transparent;cursor:pointer}
.menu-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.map-wrap{height:52vh;min-height:320px;border-radius:var(--r-xl);overflow:hidden;border:1px solid var(--outline-variant)}
.map-mini{height:240px;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--outline-variant);margin-top:8px;background:var(--surface-container-high)}
.leaflet-container{font-family:var(--font-sans);background:#e5e7eb}
.leaflet-popup-content{font-family:var(--font-sans);font-size:13px;margin:8px 12px}
.leaflet-popup-content b{color:var(--primary)}
.coord-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.loc-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--tertiary);font-weight:600}
.loc-pin{position:absolute;bottom:8px;left:8px;width:26px;height:26px;border-radius:50%;background:var(--surface-container-lowest);border:1px solid var(--outline-variant);display:grid;place-items:center;color:var(--tertiary);box-shadow:var(--shadow-card);opacity:0;transition:opacity .15s;z-index:3}
.ccard:hover .loc-pin{opacity:1}
.rec-secret{opacity:0;background:transparent;border:none;width:26px;height:26px;padding:0;margin:0 0 0 2px;cursor:default;vertical-align:middle}
  
/* ===== Calendario ===== */

/* ============ PERSISTENCIA + APPWRITE TABLES (API MODERNA) ============
   El sistema usa Appwrite Tables (servicio TablesDB) como fuente de verdad.
   Cada entidad del ERP es una tabla independiente; cada registro es una fila.
   El objeto `DB` en memoria se mantiene solo como CACHÉ: la UI lee de `DB`
   (instantáneo) y cada mutación escribe la fila concreta en Appwrite Tables.

   Sync en vivo 24/7: Appwrite Realtime (WebSocket) empuja los cambios de
   otros dispositivos en milisegundos — sin polling, sin delay.
   Anti-bugs: NO re-renderiza si el usuario está editando (modal o input con
   foco) y suprime el eco del propio evento con awSetApplying().

   === CÓMO ACTIVAR (solo 4 valores, no 5) ===
   1) cloud.appwrite.io → Create Project → anota ENDPOINT + PROJECT ID
   2) Add Platform → Web → hostname (localhost + tu dominio)
   3) Databases → Create Database → anota DATABASE ID
   4) Crea las 12 tablas listadas en TABLE_IDS (dentro de appwriteService.js)
      con sus columnas. Permissions: Users → Read+Create+Update+Delete.
   5) Edita AW_CONFIG en appwriteService.js con endpoint, projectId, databaseId.
   ¡Listo! Arranca solo: awInit() → awCargarTodo() → awIniciarRealtime().
   ================================================================== */

const DB_KEY = 'erp_panaderia_db_v1';
let _saveTimer = null;       
let _lastSavedJson = '';    // cache para detectar cambios reales vs writes no-op
let _lastSavedInit = false;

/* === isUserEditing: detecta si el usuario está trabajando y NO se debe repintar.
   Bloquea si: hay un input/select con foco, un modal abierto, o hay cambios de
   recaudo pendientes de guardar en la cola (evita que el realtime revierta datos). */
function isUserEditing(){
  const a = document.activeElement;
  if(a){
    const tag = (a.tagName || '').toLowerCase();
    if(tag==='input' || tag==='textarea' || tag==='select') return true;
    if(a.isContentEditable) return true;
  }
  // Modal abierto = usuario en medio de una acción
  const modalRoot = document.getElementById('modalRoot');
  if(modalRoot && modalRoot.children.length > 0) return true;
  // Cambios de recaudo pendientes de guardar/confirmar en la cola
  if(typeof _recaudoCola !== 'undefined' && _recaudoCola.size > 0) return true;
  if(typeof _recaudoEnviando !== 'undefined' && _recaudoEnviando) return true;
  return false;
}

/* === saveDB: SOLO cache local. Ya NO empuja un JSON global a la nube.
   Las mutaciones persistentes se hacen vía appwriteService.guardarXXX(). */
function saveDB(){
  let newJson;
  try{ newJson = JSON.stringify(DB); }catch(e){ console.warn('No se pudo serializar DB:', e); return; }
  try{ localStorage.setItem(DB_KEY, newJson); }catch(e){ console.warn('No se pudo guardar local:', e); }
  _lastSavedJson = newJson;
  _lastSavedInit = true;
}

/* === getDBSnapshot: devuelve una copia del DB en memoria (para backups) === */
function getDBSnapshot(){
  return JSON.parse(JSON.stringify(DB));
}

/* === loadDB: carga la cache local (offline-first, arranque instantáneo)
   antes de que awCargarTodo() traiga la verdad desde Appwrite Tables. === */
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){ _lastSavedJson = raw; _lastSavedInit = true; }
    if(!raw) return false;
    const saved = JSON.parse(raw);
    const defaultFC = DB.facturaConfig;
    if(saved.clientes) DB.clientes = saved.clientes;
    if(saved.productos) DB.productos = saved.productos;
    if(saved.pedidos) DB.pedidos = saved.pedidos;
    if(saved.recaudo) DB.recaudo = saved.recaudo;
    if(saved.cartera) DB.cartera = saved.cartera;
    if(saved.nomina) DB.nomina = saved.nomina;
    if(saved.conta) DB.conta = saved.conta;
    if(saved.cacheCalendario) DB.cacheCalendario = saved.cacheCalendario;
    DB.facturaConfig = Object.assign({}, defaultFC, saved.facturaConfig || {});
    if(!Array.isArray(DB.facturaConfig.orden) || DB.facturaConfig.orden.length===0) DB.facturaConfig.orden = defaultFC.orden;
    DB.facturaConfig.orden = DB.facturaConfig.orden.filter(k=>k!=='fecha');
    DB.facturaConfig.mostrarFecha = false;
    if(!DB.conta) DB.conta = defaultContaSnap();
    if(!DB.conta.transferencias) DB.conta.transferencias = [];
    if(!DB.nomina) DB.nomina = {empleados:[],historial:[]};
    try{ _lastSavedJson = JSON.stringify(DB); _lastSavedInit = true; }catch(e){}
    return true;
  }catch(e){
    console.warn('No se pudo cargar la base de datos local:', e);
    return false;
  }
}

/* ---------- Calculadora de condición (pan de 2.000) ---------- */
/* Regla:
   - Si cantidad entre 7,8,9 => 15000 dolar. De resto normal
   - 3 panes => 5000
   - Viceversa: si dinero=5000 => 3; 15000 => 9
*/
/* ---------- Exclusividad de producto: 0, 1 o VARIOS clientes ----------
   Se guarda en la misma columna `clienteExclusivo` como IDs separados por coma.
   Vacio/null = visible para todos. Compatible con los datos antiguos (1 solo ID). */
function excIds(p){
  const v = p && p.clienteExclusivo;
  if(!v) return [];
  if(Array.isArray(v)) return v.filter(Boolean);
  return String(v).split(',').map(x=>x.trim()).filter(Boolean);
}
function excVisible(p, clienteId){
  const ids = excIds(p);
  return ids.length===0 || ids.includes(clienteId);
}
function excNombres(p){
  const ids = excIds(p);
  if(!ids.length) return '';
  return ids.map(id=>DB.clientes.find(c=>c.id===id)?.nombre).filter(Boolean).join(', ');
}

function calcCondicion2000(productoId, cantidad, dinero){
  // Solo aplica al producto "Pan de 2.000" (precio 2000) -> por nombre o precio
  const prod = DB.productos.find(p=>p.id===productoId);
  // Si el producto NO vale 2.000, la condicion no aplica: se calcula normal.
  // (Antes se ignoraba el campo "Valor en dinero" y el subtotal quedaba en 0.)
  if(!prod || prod.precio!==2000) return calcNormal(productoId, cantidad, dinero);
  let q = Number(cantidad)||0, m = Number(dinero)||0;
  if(q>0 && m===0){
    // cantidad -> dinero. La cantidad se NORMALIZA para que en la factura
    // 7 u 8 panes aparezcan como 9 x $15.000 (condición 3x5.000).
    if([7,8,9].includes(q)){ m = 15000; q = 9; }
    else if(q===3){ m = 5000; q = 3; }
    else m = q*2000;
  } else if(m>0 && q===0){
    if(m===5000) q = 3;
    else if(m===15000) q = 9;
    else q = Math.round(m/2000);
  } else if(q>0 && m>0){
    // priorizar dinero
    if(m===5000) q = 3;
    else if(m===15000) q = 9;
    else q = Math.round(m/2000);
  }
  return {cantidad:q, dinero:m, subtotal:m>0?m:q*2000};
}
function calcNormal(productoId, cantidad, dinero){
  const prod = DB.productos.find(p=>p.id===productoId);
  const precio = prod?prod.precio:0;
  let q = Number(cantidad)||0, m = Number(dinero)||0;
  if(q>0 && m===0) m = q*precio;
  else if(m>0 && q===0) q = precio>0?Math.round(m/precio):0;
  else if(q>0 && m>0) m = q*precio;
  return {cantidad:q, dinero:m,subtotal:m>0?m:q*precio};
}

function getCurrentPedidoTotal(clienteId, fecha){
  const f = fecha || _clientesFecha || todayKey();
  const p = DB.pedidos.filter(x=>x.clienteId===clienteId && x.fecha===f);
  return p.reduce((a,b)=>a+b.total,0);
}
function getDeudaCliente(clienteId){
  const movs = DB.cartera.filter(m=>m.clienteId===clienteId);
  const saldo = movs.length ? movs[movs.length-1].saldoActual : 0;
  // Convención cartera: saldo negativo = cliente debe; positivo = empresa debe.
  // Invertimos para que getDeudaCliente devuelva positivo cuando el cliente debe.
  return -saldo;
}
let _searchTerm = '';
let _clientesFecha = todayKey();
let _dragSrc = null;
const CLIENT_COLORS = ['#3525cd','#fe932c','#006e4b','#ba1a1a','#d6006e','#004b98','#904d00','#7b1fa2','#00838f','#c2185b','#e65100','#2e7d32'];

let _mapaClientesAbierto = false;
function renderClientes(){
  setHeader('Clientes');
  renderClientesShell();
  renderClientesCards();
  _restaurarMapaClientes();
}
function _restaurarMapaClientes(){
  if(_mapaClientesAbierto){
    const panel = document.getElementById('clientesMapPanel');
    if(panel && panel.classList.contains('is-hidden')){
      requestAnimationFrame(()=>toggleMapaClientes(true));
    }
  }
}
function renderClientesShell(){
  const pedidosDia = DB.pedidos.filter(p=>p.fecha===_clientesFecha);
  const totalDia = pedidosDia.reduce((a,b)=>a+b.total,0);
  const isToday = _clientesFecha===todayKey();
  const fechaLabel = new Date(_clientesFecha+'T00:00:00').toLocaleDateString('es-CO',{weekday:'long',year:'numeric',month:'long',day:'2-digit'});
  $('#view').innerHTML = `
    <div class="ph"><div><h1>Clientes</h1><div class="sub">Seleccione un cliente para gestionar su pedido · Arrastre las tarjetas para organizarlas</div></div>
      <div class="h-spacer"></div>
      <button class="btn btn-ghost" onclick="toggleMapaClientes()"><span class="ms">map</span>Mapa de Clientes</button>
      <button class="btn btn-primary" onclick="nuevoClienteModal()"><span class="ms">person_add</span>Nuevo Cliente</button>
    </div>
    <div class="flex gap-sm" style="flex-wrap:wrap;align-items:center;margin-bottom:var(--s-lg);gap:12px">
      <div class="search" style="flex:1;min-width:260px">
        <span class="ms">search</span>
        <input id="searchCli" type="text" placeholder="Buscar cliente por nombre..." value="${_searchTerm}" oninput="onSearchClientes(this.value)"/>
      </div>
      <div class="flex gap-sm" style="align-items:center">
        <button class="btn ${isToday?'btn-primary':'btn-ghost'}" onclick="abrirCalendarioClientes()"><span class="ms">calendar_month</span>${isToday?'Hoy':fechaLabel}</button>
        <input type="date" id="cli-fecha" value="${_clientesFecha}" style="border:1px solid var(--outline-variant);border-radius:var(--r-lg);padding:8px 10px;background:var(--surface-container-low);color:var(--on-surface);outline:none" onchange="_clientesFecha=this.value;renderClientes()"/>
        ${!isToday?`<button class="btn btn-ghost btn-sm" onclick="_clientesFecha='${todayKey()}';renderClientes()" title="Volver a hoy"><span class="ms">restart_alt</span>Hoy</button>`:''}
      </div>
    </div>
    <div class="card mb-md" style="background:var(--surface-container-low)">
      <div class="card-b flex fb" style="flex-wrap:wrap;gap:8px">
        <div><span class="muted" style="font-size:12px">Pedidos guardados del</span> <span class="bold">${fechaLabel}</span></div>
        <div class="flex gap" style="gap:18px">
          <div><span class="muted" style="font-size:11px">Pedidos</span><div class="bold" style="font-family:var(--font-mono)">${pedidosDia.length}</div></div>
          <div><span class="muted" style="font-size:11px">Total del día</span><div class="bold" style="color:var(--primary);font-family:var(--font-mono)">${money(totalDia)}</div></div>
          <button class="btn btn-ghost btn-sm" onclick="togglePedidosDia()"><span class="ms">list_alt</span>${window._verPedidosDia?'Ocultar':'Ver'} listado</button>
        </div>
      </div>
      ${window._verPedidosDia?`<div class="card-h" style="border-top:1px solid var(--outline-variant)">${pedidosDia.length===0?'<div class="empty">No hay pedidos guardados para esta fecha</div>':`<div class="tw"><table class="d"><thead><tr><th>Cliente</th><th>Items</th><th>Comentario</th><th>Total</th><th></th></tr></thead><tbody>${pedidosDia.map(p=>{const cli=DB.clientes.find(c=>c.id===p.clienteId);return `<tr><td class="bold">${cli?cli.nombre:'-'}</td><td class="center">${p.items?p.items.length:0}</td><td>${(p.comentario||'').slice(0,40)||'-'}</td><td class="num bold">${money(p.total)}</td><td><button class="btn btn-ghost btn-sm" onclick="verPedidoGuardado('${p.id}')"><span class="ms">visibility</span></button><button class="btn btn-danger btn-sm" onclick="eliminarPedidoGuardado('${p.id}')"><span class="ms">delete</span></button></td></tr>`}).join('')}</tbody></table></div>`}</div>`:''}

      <div class="card-h"><div class="card-t"><span class="ms" style="vertical-align:middle;color:var(--tertiary)">explore</span> Mapa dinámico de clientes</div>
        <div class="h-spacer"></div>
        <span class="muted" style="font-size:12px" id="clientesMapCount"></span>

function onSearchClientes(val){
  _searchTerm = val;
  renderClientesCards();
}
function renderClientesCards(){
  const grid = $('#clientesGrid'); if(!grid) return;
  const list = DB.clientes.filter(c=>c.nombre.toLowerCase().includes(_searchTerm.toLowerCase()));
  if(list.length===0){ grid.innerHTML = `<div class="empty"><span class="ms" style="font-size:48px">person_off</span><p>No hay clientes. Agregue uno nuevo.</p></div>`; return; }
  grid.innerHTML = `<div class="cc-grid">${list.map(c=>{
    const total = getCurrentPedidoTotal(c.id, _clientesFecha);
    const deuda = getDeudaCliente(c.id);
    const tienePedidoHoy = DB.pedidos.some(p=>p.clienteId===c.id && p.fecha===_clientesFecha);
    // La tarjeta se pinta de verde si hay pedido hoy, PERO la línea separadora (--card-color) respeta el color del cliente
    const color = c.color || 'var(--primary)';
    const cardStyle = tienePedidoHoy ? `--card-color:${color};background:#eafaf0` : `--card-color:${color}`;
    return `<div class="ccard" draggable="true" data-cid="${c.id}" style="${cardStyle}" onclick="abrirPedido('${c.id}')">
      <span class="ms ccard-handle" title="Arrastrar para reordenar">drag_indicator</span>
      <button class="ccard-del icon-btn" style="right:42px" onclick="event.stopPropagation();editarClienteModal('${c.id}')" title="Editar"><span class="ms">edit</span></button>
      <button class="ccard-del icon-btn" onclick="event.stopPropagation();eliminarCliente('${c.id}')" title="Eliminar"><span class="ms">delete</span></button>
      ${(c.lat!=null && c.lng!=null)?`<button class="loc-pin" onclick="event.stopPropagation();verClienteEnMapa('${c.id}')" title="Ver en mapa"><span class="ms" style="font-size:16px">location_on</span></button>`:''}
      <div class="ccard-name"><span class="ccard-dot" style="background:${color}"></span> ${c.nombre}</div>
      <div class="muted" style="font-size:12px;margin-left:8px">Zona: ${c.tipo||'No definida'}${(c.lat!=null && c.lng!=null)?' · <span class="loc-badge"><span class="ms" style="font-size:13px">location_on</span>GPS</span>':''}</div>
      ${total>0?`<div class="ccard-row"><span>Pedido del día</span><span class="bold">${money(total)}</span></div>`:''}
      ${deuda>0?`<div class="ccard-row"><span>Pendiente (debe)</span><span class="bold" style="color:var(--error)">${money(deuda)}</span></div>`:''}
      ${deuda<0?`<div class="ccard-row"><span>A favor (le debo)</span><span class="bold" style="color:var(--tertiary)">${money(deuda*-1)}</span></div>`:''}
      ${total===0&&deuda===0?`<div class="ccard-row"><span class="muted">Sin pedidos ni deudas</span><span></span></div>`:''}
    </div>`;
  }).join('')}</div>`;
  initDragClientes();
}
function initDragClientes(){
  $$('#clientesGrid .ccard').forEach(card=>{
    card.addEventListener('dragstart', e=>{
      _dragSrc = card;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    card.addEventListener('dragend', ()=>{
      card.classList.remove('dragging');
      $$('#clientesGrid .ccard').forEach(c=>c.classList.remove('drag-over'));
    });
    card.addEventListener('dragover', e=>{
      e.preventDefault();
      if(_dragSrc && _dragSrc!==card) card.classList.add('drag-over');
    });
    card.addEventListener('dragleave', ()=> card.classList.remove('drag-over'));
    card.addEventListener('drop', e=>{
      e.preventDefault();
      card.classList.remove('drag-over');
      if(!_dragSrc || _dragSrc===card) return;
      const srcId = _dragSrc.dataset.cid;
      const tgtId = card.dataset.cid;
      const srcIdx = DB.clientes.findIndex(c=>c.id===srcId);
      const tgtIdx = DB.clientes.findIndex(c=>c.id===tgtId);
      if(srcIdx<0||tgtIdx<0) return;
      const [moved] = DB.clientes.splice(srcIdx,1);
      DB.clientes.splice(tgtIdx,0,moved);
      // persiste el nuevo orden en Appwrite Tables (cada fila con su `orden`)
      appwriteService.reordenarClientes(DB.clientes).catch(()=>{});
      saveDB();
      toast('Orden actualizado','success');
      renderClientesCards();
    });
  });
}
function togglePedidosDia(){ window._verPedidosDia = !window._verPedidosDia; renderClientes(); }
function abrirCalendarioClientes(){
  const hoy = new Date(); const y=hoy.getFullYear(), m=hoy.getMonth();
  const mesHoy = hoy.toLocaleDateString('es-CO',{month:'long',year:'numeric'});
  const dias = ['D','L','M','M','J','V','S'];
  const first = new Date(y,m,1); const last = new Date(y,m+1,0).getDate();
  const fechasConPedido = new Set(DB.pedidos.map(p=>p.fecha));
  modal('Calendario - seleccionar fecha',`
    <div class="flex fb mb-md"><div class="bold">${mesHoy}</div>
      <div class="flex gap-sm">
        <input type="month" id="cli-mes" value="${y}-${String(m+1).padStart(2,'0')}" onchange="cambiarMesCalCliente(this.value)"/>
      </div>
    </div>
    <div class="cal">${dias.map(d=>`<div class="cal-day cal-head">${d}</div>`).join('')}${Array(first.getDay()).fill('<div class="cal-day" style="visibility:hidden"></div>').join('')}${Array.from({length:last},(_,i)=>{const day=i+1;const fch=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;const tiene=fechasConPedido.has(fch);const sel=_clientesFecha===fch;return `<div class="cal-day ${sel?' worked':''}" style="${tiene?'border-color:var(--primary);font-weight:700':''}${sel?'background:var(--tertiary);color:var(--on-tertiary);border-color:var(--tertiary)':''}" onclick="selFechaCliente('${fch}')">${day}${tiene?'<span style="position:absolute;top:2px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--primary)"></span>':''}</div>`}).join('')}</div>
  `);
}
function cambiarMesCalCliente(val){
  const [y,m]=val.split('-').map(Number);
  _clientesFecha = `${y}-${String(m).padStart(2,'0')}-01`;
  closeModal(); renderClientes();
}
function selFechaCliente(fecha){
  _clientesFecha = fecha; closeModal(); renderClientes();
  toast('Fecha seleccionada: '+new Date(fecha+'T00:00:00').toLocaleDateString('es-CO'),'success');
}

  const cli = DB.clientes.find(c=>c.id===p.clienteId);

    <div class="muted mb-md">Fecha: ${p.fecha} · Modo: ${p.modoCondicion||'condicion'}</div>
    <div class="tw"><table class="d"><thead><tr><th>Producto</th><th class="right">Cant.</th><th class="right">Subtotal</th>${(p.items||[]).some(i=>i.vendajes>0)?'<th class="right">Vendajes</th>':''}</tr></thead><tbody>
      ${(p.items||[]).map(it=>`<tr><td>${it.nombre}</td><td class="num">${it.cantidad}</td><td class="num bold">${money(it.subtotal)}</td>${(p.items||[]).some(i=>i.vendajes>0)?`<td class="num">${it.vendajes>0?it.vendajes:''}</td>`:''}</tr>`).join('')}

let _pickerMap = null;
let _pickerMarker = null;
function initClientPickerMap(lat, lng){
  setTimeout(()=>{
    const el = document.getElementById('nc-map');
    if(!el || typeof L==='undefined'){ if(el) el.innerHTML='<div class="empty">Mapa no disponible</div>'; return; }
    const la = (lat!=='' && !isNaN(Number(lat))) ? Number(lat) : 4.7110;
    const ln = (lng!=='' && !isNaN(Number(lng))) ? Number(lng) : -74.0721;
    if(_pickerMap){ try{_pickerMap.remove()}catch(e){}; _pickerMap=null; }
    _pickerMap = L.map('nc-map').setView([la,ln], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap',maxZoom:19}).addTo(_pickerMap);
    _pickerMarker = L.marker([la,ln],{draggable:true}).addTo(_pickerMap);
    _pickerMarker.on('dragend', e=>{ const p=e.target.getLatLng(); setCoordInputs(p.lat,p.lng); });
    _pickerMap.on('click', e=>{ _pickerMarker.setLatLng(e.latlng); setCoordInputs(e.latlng.lat,e.latlng.lng); });
    setTimeout(()=>{ try{_pickerMap.invalidateSize()}catch(e){} }, 150);
  }, 120);
}
function setCoordInputs(lat, lng){
  const a=document.getElementById('nc-lat'), b=document.getElementById('nc-lng');
  if(a) a.value = Number(lat).toFixed(6);
  if(b) b.value = Number(lng).toFixed(6);
}
function syncPickerMap(){
  const la=Number(document.getElementById('nc-lat').value);
  const ln=Number(document.getElementById('nc-lng').value);
  if(isNaN(la)||isNaN(ln)) return;
  if(_pickerMap && _pickerMarker){ _pickerMarker.setLatLng([la,ln]); _pickerMap.setView([la,ln], 14); }
}
function usarMiUbicacion(){
  if(!navigator.geolocation){ toast('Geolocalización no disponible en este dispositivo','error'); return; }
  toast('Obteniendo ubicación...','');
  navigator.geolocation.getCurrentPosition(pos=>{
    const la=pos.coords.latitude, ln=pos.coords.longitude;
    setCoordInputs(la,ln);
    if(_pickerMap){ _pickerMap.setView([la,ln],16); _pickerMarker.setLatLng([la,ln]); }
    toast('Ubicación actual obtenida','success');
  }, err=>{
    toast('No se pudo obtener la ubicación: '+err.message,'error');
  }, {enableHighAccuracy:true, timeout:10000});
}
function quitarCoordenadas(){
  const a=document.getElementById('nc-lat'), b=document.getElementById('nc-lng');
  if(a) a.value=''; if(b) b.value='';
  toast('Ubicación quitada','');
}
async function guardarCliente(id){
  const nombre = $('#nc-nombre').value.trim();
  if(!nombre){ toast('El nombre es obligatorio','error'); return; }
  const latRaw = $('#nc-lat') ? $('#nc-lat').value.trim() : '';
  const lngRaw = $('#nc-lng') ? $('#nc-lng').value.trim() : '';
  const lat = (latRaw!=='' && !isNaN(Number(latRaw))) ? Number(latRaw) : null;
  const lng = (lngRaw!=='' && !isNaN(Number(lngRaw))) ? Number(lngRaw) : null;
  const data = {nombre,tipo:$('#nc-tipo').value,telefono:$('#nc-tel').value,direccion:$('#nc-dir').value,color:$('#nc-color').value,lat,lng};
  try{
    if(id){ await appwriteService.guardarCliente({id, ...data}); }
    else  { await appwriteService.guardarCliente(data); }
    saveDB(); toast('Cliente guardado','success'); closeModal(); renderClientes();
  }catch(e){ toast('No se pudo guardar el cliente','error'); }
}

}
async function _delCliente(id){

  }catch(e){ toast('No se pudo eliminar el cliente','error'); }
}

/* ---------- Mapa dinámico de clientes (Leaflet) ---------- */
let _cliMapInstance = null;
function toggleMapaClientes(forced){
  const panel = document.getElementById('clientesMapPanel');
  if(!panel) return;
  const show = forced===true ? true : panel.classList.contains('is-hidden');
  if(show){
    panel.classList.remove('is-hidden');
    _mapaClientesAbierto = true;   // recordar estado para sobrevivir re-renders
    setTimeout(initMapaClientes, 120);
  } else {
    panel.classList.add('is-hidden');
    _mapaClientesAbierto = false;
    if(_cliMapInstance){ try{_cliMapInstance.remove()}catch(e){}; _cliMapInstance=null; }
  }
}
function initMapaClientes(focusId){
  const el = document.getElementById('clientesMap');
  if(!el || typeof L==='undefined'){ if(el) el.innerHTML='<div class="empty">Mapa no disponible (sin conexión a Leaflet)</div>'; return; }
  if(_cliMapInstance){ try{_cliMapInstance.remove()}catch(e){}; _cliMapInstance=null; }
  _cliMapInstance = L.map('clientesMap');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap',maxZoom:19}).addTo(_cliMapInstance);
  const conCoords = DB.clientes.filter(c=>c.lat!=null && c.lng!=null && !isNaN(Number(c.lat)) && !isNaN(Number(c.lng)));
  const cnt = document.getElementById('clientesMapCount');
  if(cnt) cnt.textContent = conCoords.length + ' cliente(s) con ubicación';
  conCoords.forEach(c=>{
    const color = c.color || '#3525cd';
    const m = L.circleMarker([Number(c.lat),Number(c.lng)],{radius:11,color:'#fff',weight:2,fillColor:color,fillOpacity:0.95}).addTo(_cliMapInstance);
    const total = getCurrentPedidoTotal(c.id, _clientesFecha);
    const deuda = getDeudaCliente(c.id);
    m.bindPopup(`<b>${c.nombre}</b>`+
      `${c.tipo?`<br><span class="muted">Zona: ${c.tipo}</span>`:''}`+
      `${c.direccion?`<br>${c.direccion}`:''}`+
      `${c.telefono?`<br>Tel: ${c.telefono}`:''}`+
      `${total>0?`<br><b>Pedido hoy: ${money(total)}</b>`:''}`+

function copiarYabrirUbicacion(clienteId){
  const c = DB.clientes.find(x=>x.id===clienteId);
  if(!c || c.lat==null || c.lng==null){ toast('Este cliente no tiene ubicación guardada','error'); return; }
  const lat = Number(c.lat), lng = Number(c.lng);
  const url = `https://www.google.com/maps?q=${lat},${lng}`;
  const texto = `${c.nombre}\nLat: ${lat}\nLng: ${lng}\n${url}`;
  // Copiar al portapapeles
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(texto).then(()=>toast('Ubicación copiada al portapapeles','success')).catch(()=>{
        fallbackCopiar(texto);
      });
    } else { fallbackCopiar(texto); }
  }catch(e){ fallbackCopiar(texto); }
  // Abrir Google Maps directamente, sin rodeos
  window.open(url, '_blank');
  toast('Abriendo Google Maps...','default');
}
function fallbackCopiar(texto){
  const ta = document.createElement('textarea');

  try{ document.execCommand('copy'); toast('Ubicación copiada al portapapeles','success'); }catch(e){ toast('No se pudo copiar automáticamente','error'); }
  document.body.removeChild(ta);
}

function updateItem(pid, field, val){
  if(!_itemsPedido[pid]) _itemsPedido[pid] = {cantidad:0,dinero:0};
  _itemsPedido[pid][field] = parseNum(val);
  if(field==='cantidad') _itemsPedido[pid].dinero = 0;
  if(field==='dinero') _itemsPedido[pid].cantidad = 0;
  // Actualizar SOLO los subtotales y el total, sin re-renderizar (mantiene el foco del input)
  const prod = DB.productos.find(p=>p.id===pid);
  if(!prod) return;
  const it = _itemsPedido[pid];
  const calc = _modoCondicion==='condicion' ? calcCondicion2000(pid,it.cantidad,it.dinero) : calcNormal(pid,it.cantidad,it.dinero);
  const elSub = document.getElementById('sub-'+pid);
  if(elSub) elSub.textContent = money(calc.subtotal);
  // Pintar la tarjeta y sus inputs de verde si tiene valor, gris si no
  const elCard = document.getElementById('card-'+pid);
  if(elCard){
    const activo = calc.subtotal > 0;
    elCard.classList.toggle('has-item', activo);
    elCard.querySelectorAll('.prod-row input').forEach(inp=>{
      const v = parseNum(inp.value);
      inp.classList.toggle('has-value', v > 0);
    });
  }
  const elVend = document.getElementById('vend-'+pid);
  if(elVend){ const v = (prod.vendajeActivo && prod.vendajeCada>0 && calc.cantidad>0) ? Math.floor(calc.cantidad/prod.vendajeCada) : 0; elVend.innerHTML = v>0 ? `<div class="badge badge-warn">Vendajes: ${v}</div>` : ''; }
  // Recalcular total
  const productos = DB.productos.filter(p=>p.activo);
  let total = 0;
  productos.forEach(p=>{
    const it2 = _itemsPedido[p.id] || {cantidad:0,dinero:0};
    const c = _modoCondicion==='condicion' ? calcCondicion2000(p.id,it2.cantidad,it2.dinero) : calcNormal(p.id,it2.cantidad,it2.dinero);
    total += c.subtotal;
  });
  const elT = document.getElementById('totalPedido');
  if(elT) elT.textContent = money(total);
}

async function guardarPedido(silent){
  if(!_currentCliente){ if(!silent) toast('Seleccione cliente','error'); return; }
  const productos = DB.productos.filter(p=>p.activo);
  const items = productos.map(p=>{
    const it = _itemsPedido[p.id] || {cantidad:0,dinero:0};
    const calc = _modoCondicion==='condicion' ? calcCondicion2000(p.id,it.cantidad,it.dinero) : calcNormal(p.id,it.cantidad,it.dinero);
    return {productoId:p.id,nombre:p.nombre,precio:p.precio,cantidad:calc.cantidad,subtotal:calc.subtotal,vendajes:(p.vendajeActivo&&p.vendajeCada>0&&calc.cantidad>0)?Math.floor(calc.cantidad/p.vendajeCada):0};
  }).filter(x=>x.subtotal>0);
  const fecha = _clientesFecha || todayKey();
  const existente = DB.pedidos.find(p=>p.clienteId===_currentCliente && p.fecha===fecha);
  // Pedido en cero / limpio: se elimina el pedido existente y su fila de recaudo
  if(items.length===0){
    if(existente){
      await appwriteService.eliminarPedido(existente.id);
      saveDB();
      if(!silent) toast('Pedido guardado en 0 y retirado del recaudo','success');
    } else {
      if(!silent) toast('No hay productos para guardar','error');
    }
    if(!silent){ _itemsPedido={}; _comentarioPedido=''; go('clientes'); }
    return;
  }
  const total = items.reduce((a,b)=>a+b.subtotal,0);
  try{
    if(existente){
      await appwriteService.editarPedido(existente.id, {items, comentario:_comentarioPedido, total, modoCondicion:_modoCondicion});
    } else {
      await appwriteService.guardarPedido({clienteId:_currentCliente, fecha, items, comentario:_comentarioPedido, total, modoCondicion:_modoCondicion});
    }
    sincronizarRecaudoDia(fecha);
    saveDB();
    if(!silent){
      toast('Pedido guardado','success');
      _itemsPedido={}; _comentarioPedido='';
      go('clientes');
    }
  }catch(e){ if(!silent) toast('No se pudo guardar el pedido','error'); }
}
/* Imprime HTML de ticket usando un IFRAME oculto: no depende de pop-ups,
   nunca se queda en about:blank y se autolimpia. Es el método fiable. */
function imprimirPorIframe(htmlCompleto){
  // Eliminar cualquier iframe de impresión previo que haya quedado.
  const viejo = document.getElementById('print-frame');
  if(viejo) viejo.remove();

  const iframe = document.createElement('iframe');
  iframe.id = 'print-frame';
  iframe.style.position = 'fixed';
  iframe.style.right = '0';
  iframe.style.bottom = '0';
  iframe.style.width = '0';
  iframe.style.height = '0';
  iframe.style.border = '0';
  document.body.appendChild(iframe);

  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(htmlCompleto);
  doc.close();

  // Esperar a que el contenido (y fuentes) carguen antes de imprimir.
  const lanzar = () => {
    try{
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
    }catch(e){ console.warn('print', e); }
    // Limpiar el iframe después de imprimir (o de cancelar).
    setTimeout(()=>{ try{ iframe.remove(); }catch(e){} }, 1500);
  };
  // onload asegura que el DOM del iframe esté listo.
  if(iframe.contentWindow.document.readyState === 'complete') setTimeout(lanzar, 200);
  else iframe.onload = () => setTimeout(lanzar, 200);
}

      if(f.mostrarDireccion) b += `<div ${sty(f.tamInfo||11,f.negInfo,f.alineaInfo||'center')}>${esc(f.direccion)}</div>`;
    }
    if(key==='separador') b += cut;

    if(key==='numTicket' && f.mostrarNumTicket!==false){

    if(key==='cliente' && f.mostrarCliente!==false){
      const aliCli = f.alineaCliente || 'center';
      b += `<div ${sty(f.tamCliente||13,f.negCliente!==false,aliCli,null,'margin:2px 0')}>Cliente: ${esc(cliNombre||'-')}</div>`;
    }
    if(key==='productosTitulo' && f.mostrarProductosTitulo!==false) b += `<div ${sty(f.tamItems||16,true,'center')}>${esc(f.labelProductos||'PRODUCTOS')}</div>`;
    if(key==='items'){
      items.forEach((it,idx)=>{
        // Línea separadora entre cada producto (no antes del primero)
        if(idx>0) b += cut;
        const pu = it.precioUnitario!=null ? money(it.precioUnitario) : '';
        let linea;
        if(f.mostrarPrecioUnitario!==false && pu){
          linea = `${it.nombre}  ${pu} x ${it.cantidad} = ${money(it.subtotal)}`;
        } else {
          linea = `${it.nombre} x ${it.cantidad} = ${money(it.subtotal)}`;
        }
        b += `<div ${sty(f.tamItems||16,f.negItems!==false,f.alineaItems||'center',null,`line-height:${(f.tamItems||16)+2}px`)}>${esc(linea)}</div>`;
        // ===== VENDAJE (siempre se respeta si el producto lo tiene configurado) =====
        const vCada = Number(it.vendajeCada)||0;
        const vActivo = it.vendajeActivo!==false; // se muestra salvo que se haya desactivado expresamente
        const vCant = Number(it.cantidad)||0;
if(vCada>0 && vActivo && vCant>0){
          const vend = Math.floor(vCant/vCada);
          if(vend>0){
            const pct = it.vendajePct? ('(' + it.vendajePct + '%)') : '';
            const lblRaw = f.labelVendaje || 'VENDAJE';
            const lbl = lblRaw.replace(/:?\s*$/, '');
            const txt = lbl + (pct ? (' ' + pct) : '') + ' = ' + vend;
            b += `<div ${sty((f.tamVendajes||14),true,f.alineaItems||'center','#fe932c','margin-top:2px')}>${esc(txt)}</div>`;
          }
        }
      });
    }
    if(key==='comentario' && comentario) b += `<div ${sty(f.tamComentario||11,f.negComentario||false,'left')}>${esc(f.labelComentario||'Comentario:')}</div><div ${sty(f.tamComentario||11,false,'left')}>${esc(comentario)}</div>`;
    if(key==='total'){
      b += cut;
      // TOTAL centrado (alineaTotal por defecto 'center')
      const alignTotal = f.alineaTotal || 'center';
      b += `<div ${sty(f.tamTotal||22,f.negTotal!==false,alignTotal,null,`margin-top:4px`)}><span>${esc(f.labelTotal||'TOTAL')}: </span><span style="${f.colorTotal?`color:${f.colorTotal};`:''}">${money(total)}</span></div>`;
      // Deuda automática abajo del TOTAL (centrado)
      if(deudaInfo){
        const lblDebe = f.labelDebeCliente || 'DEUDA DEL CLIENTE';
        const lblDebo = f.labelDeboCliente || 'SALDO A FAVOR DEL CLIENTE';
        const colorDeuda = deudaInfo.tipo==='debe' ? (f.colorDeuda||'#ba1a1a') : (f.colorFavor||'#005338');
        const labelText = deudaInfo.tipo==='debe' ? lblDebe : lblDebo;
        b += `<div ${sty(f.tamDeuda||18,true,'center',colorDeuda,`margin-top:2px`)}>${esc(labelText)}: ${money(deudaInfo.valor)}</div>`;
        // TOTAL A COBRAR: suma la deuda (cliente debe) o resta el saldo a favor (empresa debe)
        const totalCobrar = deudaInfo.tipo==='debe' ? total + deudaInfo.valor : Math.max(0, total - deudaInfo.valor);
        b += cut;
        b += `<div ${sty((f.tamTotal||22)+2,true,f.alineaTotal||'center','#000','margin-top:4px')}>TOTAL A COBRAR: ${money(totalCobrar)}</div>`;
      }
    }
    if(key==='mensaje' && f.mensaje) b += `${cut}<div ${sty(f.tamMensaje||12,f.negMensaje,'center')}>${esc(f.mensaje)}</div>`;
    if(key==='piePagina' && f.piePagina) b += `<div ${sty(f.tamPie||12,f.negPie,'center')} style="margin-top:6px">${esc(f.piePagina)}</div>`;
  });
  return b;
}
function generarTicketImpresion(){
  const items = obtenerItemsPedidoActual();
  if(items.length===0){ toast('No hay productos para imprimir','error'); return; }
  const total = items.reduce((a,b)=>a+b.subtotal,0);
  const cli = DB.clientes.find(c=>c.id===_currentCliente);
  const f = DB.facturaConfig;
  // Bug #5: guardar el pedido ANTES de abrir la ventana de impresión, así nunca
  // se pierde la información aunque el usuario cierre la ventana emergente.
  guardarPedido(true);
  f.consecutivoTicket = (f.consecutivoTicket||1) + 1;
  appwriteService.guardarFacturaConfig({consecutivoTicket: f.consecutivoTicket}).catch(()=>{});
  saveDB();
  const numTicket = f.consecutivoTicket - 1;
  const body = componerTicketHTML(items, total, cli?cli.nombre:'', _comentarioPedido, numTicket, _currentCliente);
  const fuente = f.fuente||'monospace';
  imprimirPorIframe(`<!doctype html><html><head><meta charset="utf-8"><title>Ticket</title>
    <style>*{box-sizing:border-box}body{margin:0;padding:0;background:#fff}.ticket{width:80mm;padding:4mm 3mm;margin:0 auto;background:#fff;color:#000;font-family:${fuente}}.cut{border-top:1px dashed #000;margin:4px 0}@media print{body{background:#fff}button{display:none}}</style></head>
    <body><div class="ticket">${body}</div></body></html>`);
  toast('Pedido guardado · imprimiendo ticket','success');
  setTimeout(()=>{ _itemsPedido={}; _comentarioPedido=''; go('clientes'); }, 500);
}

function toggleProdActivo(id,val){ const p=DB.productos.find(x=>x.id===id); if(p){ appwriteService.toggleProductoActivo(id,val).catch(()=>{}); saveDB(); toast('Producto '+(val?'activado':'desactivado'),'success'); } }
function moverOrden(id,dir){
  const sorted = [...DB.productos].sort((a,b)=>a.orden-b.orden);
  const i = sorted.findIndex(p=>p.id===id);
  const j = i+dir; if(j<0||j>=sorted.length) return;
  const a = sorted[i].orden, b = sorted[j].orden;
  sorted[i].orden = b; sorted[j].orden = a;
  appwriteService.reordenarProductos(sorted).catch(()=>{});
  saveDB(); renderProductos();
}

function fileToData(input, targetId){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader(); r.onload = ()=>{ document.getElementById(targetId).value = r.result; toast('Imagen cargada','success'); }; r.readAsDataURL(f);
}
async function guardarProd(id){
  const data = {
    nombre: $('#p-nombre').value.trim(),
    precio: Number($('#p-precio').value)||0,
    orden: Number($('#p-orden').value)||1,
    imagen: $('#p-img').value,
    vendajeActivo: $('#p-vendaje').value==='true',
    vendajePct: Number($('#p-vpct').value)||0,
    vendajeCada: Number($('#p-vcada').value)||0,
    clienteExclusivo: Array.from($('#p-exc').selectedOptions).map(o=>o.value).filter(Boolean).join(',') || null,
    activo: $('#p-activo').value==='true'
  };
  if(!data.nombre){ toast('Nombre obligatorio','error'); return; }
  try{
    if(id){ await appwriteService.guardarProducto({id, ...data}); }
    else  { await appwriteService.guardarProducto(data); }
    saveDB(); toast('Producto guardado','success'); closeModal(); renderProductos();
  }catch(e){ toast('No se pudo guardar el producto','error'); }
}
function eliminarProd(id){
  modal('Eliminar producto','<p>¿Eliminar el producto?</p>',`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-danger" onclick="_delProd('${id}')">Eliminar</button>`);
}
async function _delProd(id){
  try{ await appwriteService.eliminarProducto(id); saveDB(); closeModal(); renderProductos(); toast('Producto eliminado','success'); }
  catch(e){ toast('No se pudo eliminar el producto','error'); }
}

/* Switch CSS inject */
function initSwitchCSS(){
  if(window._switchCss) return; window._switchCss=true;
  const s=document.createElement('style'); s.textContent=`.switch{display:inline-flex;position:relative;width:42px;height:22px;cursor:pointer}.switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:2}.switch:before{content:'';position:absolute;inset:0;background:var(--surface-container-high);border-radius:9999px;transition:.2s}.switch:after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}.switch input:checked:before{background:var(--tertiary)}.switch input:checked:after{transform:translateX(20px)}`;
  document.head.appendChild(s);
}

function tipografiaSeccion(label, tamKey, negKey, alignKey){
  const f = DB.facturaConfig;
  return `<div class="card mb-md"><div class="card-b">

    </div>
  </div></div>`;
}
/* Guardado automático de tipografía: persiste en el acto sin re-renderizar (no
   pierde foco ni resetea los inputs del formulario mientras se edita). */
let _autoTipTimer = null;
function autoSaveTipografia(){
  if(_autoTipTimer) clearTimeout(_autoTipTimer);
  _autoTipTimer = setTimeout(()=>{
    const f = DB.facturaConfig;
    const tams = ['tamEncabezado','tamNombre','tamInfo','tamCliente','tamItems','tamVendajes','tamTotal','tamComentario','tamMensaje','tamPie'];
    const negs = ['negEncabezado','negNombre','negInfo','negCliente','negItems','negVendajes','negTotal','negMensaje','negPie'];
    const aligns = ['alineaEncabezado','alineaNombre','alineaInfo','alineaCliente','alineaTotal','alineaItems'];
    const patch = {};
    tams.forEach(k=>{ const el=$('#tip-'+k); if(el){ f[k]=Number(el.value)||11; patch[k]=f[k]; } });
    negs.forEach(k=>{ const el=$('#tip-'+k); if(el){ f[k]=el.value==='true'; patch[k]=f[k]; } });
    aligns.forEach(k=>{ const el=$('#tip-'+k); if(el){ f[k]=el.value; patch[k]=f[k]; } });
    appwriteService.guardarFacturaConfig(patch).catch(()=>{});
    saveDB();
  }, 250);
}

/* ===================== RECAUDO DE DOMICILIARIOS ===================== */
let _recaudoFecha = todayKey();
async function sincronizarRecaudoDia(fecha){
  const pedidos = DB.pedidos.filter(p=>p.fecha===fecha);
  if(!DB.recaudo[fecha]) DB.recaudo[fecha]={};
  const r = DB.recaudo[fecha];
  for(const p of pedidos){
    if(!r[p.id]){
      const cli = DB.clientes.find(c=>c.id===p.clienteId);
      const nuevaFila = {
        pedidoId:p.id, clienteId:p.clienteId, cliente:cli?cli.nombre:'', tipo:cli?cli.tipo:'',
        subtotal:p.total, deuda:0, entregado:false, recibido:false, recaudado:false,
        nequi:0, bancolombia:0, deudaPago:0, debeCliente:0,
        faltante:0, salida:0, observacion:'', efectivo:0, fecha
      };
      // crea la fila en Appwrite Tables
      try{ const saved = await appwriteService.guardarRecaudo(nuevaFila); if(saved) nuevaFila.id = saved.id; }catch(e){}
      r[p.id] = nuevaFila;
    } else {
      // Solo memoria. NO se re-guarda en Appwrite en cada render (eso causaba el 429).
      const cambioSub = r[p.id].subtotal !== p.total;
      r[p.id].subtotal = p.total;
      r[p.id].cliente = (DB.clientes.find(c=>c.id===p.clienteId)||{}).nombre || r[p.id].cliente;
      if(r[p.id].recaudado===undefined) r[p.id].recaudado=false;
      if(cambioSub && r[p.id].id) _encolarRecaudo(r[p.id]);
    }
  }
}

/* ===== Modal PAGO DEUDA (columna) — medio, valor y cálculo sobra/falta ===== */
function abrirModalPagoDeuda(pedidoId){
  const r = DB.recaudo[_recaudoFecha] && DB.recaudo[_recaudoFecha][pedidoId]; if(!r) return;
  const saldo = r.clienteId ? getSaldoCliente(r.clienteId) : 0;
  const debe = saldo < 0 ? Math.abs(saldo) : 0;       // el cliente ME debe
  const leDebo = saldo > 0 ? saldo : 0;                // YO le debo
  const cli = r.clienteId ? DB.clientes.find(c=>c.id===r.clienteId) : null;
  const nombre = cli ? cli.nombre : (r.cliente||'Cliente');
  const ctx = debe>0 ? `El cliente debe <b>${money(debe)}</b>.`
            : leDebo>0 ? `Tú le debes <b>${money(leDebo)}</b>.`
            : `Cliente al día.`;
  const yaPago = Number(r.deudaPago)||0;
  modal(`Pago de deuda · ${nombre}`, `
    <p>${ctx}</p>
    ${yaPago>0?`<p class="mt-md muted">Ya registrado: ${money(yaPago)} (${r.deudaPagoMedio||'efectivo'}). Se reemplazará.</p>`:''}
    <p class="mt-md bold">¿De dónde proviene el pago?</p>
    <div class="flex gap mt-md" style="flex-direction:column">
      <button class="btn btn-primary" style="width:100%" onclick="pagoDeudaMedio('${pedidoId}','efectivo')"><span class="ms">payments</span> Efectivo</button>
      <button class="btn btn-secondary" style="width:100%" onclick="pagoDeudaMedio('${pedidoId}','nequi')"><span class="ms">smartphone</span> Nequi</button>
      <button class="btn btn-secondary" style="width:100%" onclick="pagoDeudaMedio('${pedidoId}','bancolombia')"><span class="ms">account_balance</span> Bancolombia</button>
    </div>
    ${yaPago>0?`<button class="btn btn-ghost mt-md" style="width:100%;border:1px solid var(--error);color:var(--error)" onclick="pagoDeudaBorrar('${pedidoId}')"><span class="ms">delete</span> Quitar este pago</button>`:''}
  `, '<button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>');
}
function pagoDeudaMedio(pedidoId, medio){
  const r = DB.recaudo[_recaudoFecha] && DB.recaudo[_recaudoFecha][pedidoId]; if(!r) return;
  const saldo = r.clienteId ? getSaldoCliente(r.clienteId) : 0;
  const debe = saldo < 0 ? Math.abs(saldo) : 0;
  const nombreMedio = medio==='efectivo'?'Efectivo':medio==='nequi'?'Nequi':'Bancolombia';
  modal(`Pago de deuda · ${nombreMedio}`, `
    <p>¿Cuánto pagó el cliente por <b>${nombreMedio}</b>?</p>
    <div class="field mt-md"><label>Valor pagado</label>
      <input id="pd-valor" type="number" value="${debe||''}" placeholder="Ej: 20000" style="font-size:16px"/></div>
    <div id="pd-preview" class="muted mt-md" style="font-size:12px"></div>
  `, `<button class="btn btn-ghost" onclick="abrirModalPagoDeuda('${pedidoId}')">Atrás</button>
      <button class="btn btn-primary" onclick="pagoDeudaConfirm('${pedidoId}','${medio}')">Confirmar</button>`);
  setTimeout(()=>{
    const el=document.getElementById('pd-valor');
    if(el){ el.focus(); el.select();
      const upd=()=>{
        const v=Number(el.value)||0;
        const prev=document.getElementById('pd-preview');
        if(!prev) return;
        if(debe>0 && v>debe) prev.innerHTML=`El cliente paga de más: le quedarás debiendo <b style="color:#004b98">${money(v-debe)}</b>.`;
        else if(debe>0 && v<debe) prev.innerHTML=`Queda debiendo <b style="color:#ba1a1a">${money(debe-v)}</b>.`;
        else if(debe>0 && v===debe) prev.innerHTML=`Paga exacto. Queda al día.`;
        else prev.innerHTML='';
      };
      el.oninput=upd; upd();
    }
  }, 60);
}
function pagoDeudaConfirm(pedidoId, medio){
  const r = DB.recaudo[_recaudoFecha] && DB.recaudo[_recaudoFecha][pedidoId]; if(!r) return;
  const valor = Number(document.getElementById('pd-valor').value)||0;
  if(valor<=0){ toast('Ingresa un valor válido','error'); return; }

  // Revertir un pago anterior de esta fila (si lo había) antes de aplicar el nuevo
  _revertirPagoDeudaFila(r);

  const saldo = r.clienteId ? getSaldoCliente(r.clienteId) : 0;
  const debe = saldo < 0 ? Math.abs(saldo) : 0;   // cuánto debía el cliente ANTES de este pago

  // Guardar el pago
  r.deudaPago = valor;
  r.deudaPagoMedio = medio;
  // Reflejar en el canal correspondiente
  if(medio==='nequi') r.nequi = (Number(r.nequi)||0) + valor;
  else if(medio==='bancolombia') r.bancolombia = (Number(r.bancolombia)||0) + valor;
  // (efectivo lo suma el KPI vía deudaPagoMedio)

  // Cartera: el cliente abona su deuda
  if(r.clienteId) registrarMovCartera(r.clienteId,'pago_deuda',valor,`Pago deuda (${medio}) ${_recaudoFecha}`);

  // Si pagó de MÁS, el excedente es un saldo a favor del cliente (yo le debo)
  const excedente = valor - debe;
  if(debe>0 && excedente>0 && r.clienteId){
    registrarMovCartera(r.clienteId,'debo_cliente',excedente,`Sobrepago deuda ${_recaudoFecha}`);
  }

  r.recibido = true;
  recalcEfectivoFila(r);
  saveDB(); _encolarRecaudo(r);
  // repintar todas las filas del cliente (cambió su cartera)
  if(r.clienteId){
    Object.values(DB.recaudo[_recaudoFecha]||{}).forEach(o=>{ if(o.clienteId===r.clienteId) _repintarFilaRecaudo(o.pedidoId); });
  } else _repintarFilaRecaudo(pedidoId);
  _repintarTotalesRecaudo();
  closeModal();
  let msg = `Pago ${money(valor)} · ${medio}`;
  if(debe>0 && excedente>0) msg += ` · le quedas debiendo ${money(excedente)}`;
  else if(debe>0 && valor<debe) msg += ` · aún debe ${money(debe-valor)}`;
  toast(msg,'success');
}
function pagoDeudaBorrar(pedidoId){
  const r = DB.recaudo[_recaudoFecha] && DB.recaudo[_recaudoFecha][pedidoId]; if(!r) return;
  _revertirPagoDeudaFila(r);
  r.deudaPago = 0; r.deudaPagoMedio = null;
  recalcEfectivoFila(r);
  saveDB(); _encolarRecaudo(r);
  if(r.clienteId){
    Object.values(DB.recaudo[_recaudoFecha]||{}).forEach(o=>{ if(o.clienteId===r.clienteId) _repintarFilaRecaudo(o.pedidoId); });
  } else _repintarFilaRecaudo(pedidoId);
  _repintarTotalesRecaudo();
  closeModal();
  toast('Pago de deuda quitado','default');
}
/* Revierte en cartera y en los canales el pago de deuda ya aplicado a la fila */
function _revertirPagoDeudaFila(r){
  const prev = Number(r.deudaPago)||0;
  if(prev<=0) return;
  const medio = r.deudaPagoMedio || 'efectivo';
  if(medio==='nequi') r.nequi = Math.max(0,(Number(r.nequi)||0)-prev);
  else if(medio==='bancolombia') r.bancolombia = Math.max(0,(Number(r.bancolombia)||0)-prev);
  if(r.clienteId) registrarMovCartera(r.clienteId,'deuda',prev,`Reversa pago deuda ${_recaudoFecha}`);
}

function recalcEfectivoFila(r){
  if(!r) return;
  // Efectivo del PEDIDO (venta del día). NO incluye el pago de deuda vieja:
  // ese se maneja aparte en deudaPago para no contarlo dos veces en los totales.
  r.efectivo = Math.max(0,
      (Number(r.subtotal)||0)
    - (Number(r.nequi)||0)
    - (Number(r.bancolombia)||0)
    - (Number(r.deuda)||0)        // el pedido queda debiendo: NO entra efectivo
    - (Number(r.faltante)||0)
    - (Number(r.salida)||0)
    - (Number(r.debeCliente)||0)  // descuento por lo que le debo al cliente (efectivo)
  );
}
/** Suma de deudas incluidas (checkbox marcado) para el KPI "Total a cobrar". */
function _calcTotalConDeudas(){
  const filas = Object.values(DB.recaudo[_recaudoFecha]||{});
  let total = 0;
  for(const f of filas){
    total += Number(f.subtotal)||0;
    if(f.incluirDeuda){
      const saldo = f.clienteId ? getSaldoCliente(f.clienteId) : 0;
      if(saldo < 0) total += Math.abs(saldo);  // cliente debe → se suma
      else if(saldo > 0) total -= saldo;         // empresa debe → se resta
    }
  }
  return Math.max(0, total);
}
function toggleIncluirDeuda(pedidoId, val){
  const r = DB.recaudo[_recaudoFecha] && DB.recaudo[_recaudoFecha][pedidoId]; if(!r) return;
  r.incluirDeuda = val;
  saveDB();
  _encolarRecaudo(r);
  _repintarFilaRecaudo(pedidoId);
  _repintarTotalesRecaudo();
}
/* Cola de guardado de recaudo: agrupa por fila y envía espaciado.
   Evita el 429 de Appwrite cuando se marcan varias filas seguidas. */
const _recaudoCola = new Map();   // rowId -> objeto fila a guardar
let _recaudoTimer = null;
let _recaudoEnviando = false;

function _encolarRecaudo(r){
  _recaudoCola.set(r.id, r);
  if(_recaudoTimer) clearTimeout(_recaudoTimer);
  _recaudoTimer = setTimeout(_procesarColaRecaudo, 300);  // espera breve a que dejes de escribir
}

async function _procesarColaRecaudo(){
  if(_recaudoEnviando) return;
  _recaudoEnviando = true;
  try{
    // Se procesa la cola de a UNA fila, con pausa entre cada una.
    while(_recaudoCola.size){
      const [id, fila] = _recaudoCola.entries().next().value;
      _recaudoCola.delete(id);
      try{
        await appwriteService.editarRecaudo(fila.id, fila);
      }catch(e){
        // Si Appwrite devuelve 429, se reencola y se espera más antes de reintentar.
        if(String(e && e.message || '').includes('429') || (e && e.code===429)){
          _recaudoCola.set(id, fila);
          await new Promise(res=>setTimeout(res, 3000));
        }
      }
      await new Promise(res=>setTimeout(res, 400));  // separa bien las peticiones
    }
  } finally {
    _recaudoEnviando = false;
  }
}

/* Repinta SOLO una fila (color, botón, efectivo), sin re-renderizar la tabla. */
function _repintarFilaRecaudo(id){
  const r = DB.recaudo[_recaudoFecha] && DB.recaudo[_recaudoFecha][id]; if(!r) return;
  const tr = document.querySelector(`tr[data-id="${id}"]`);
  if(!tr) return;
  const cliR = r.clienteId ? DB.clientes.find(c=>c.id===r.clienteId) : null;
  const colorR = cliR?.color || 'var(--primary)';
  tr.style.background = r.recibido ? '#e6f7ec' : (r.recaudado ? '#ffe0b2' : '#ffffff');
  tr.style.borderLeft = `5px solid ${colorR}`;
  const tdNom = tr.querySelector('td.bold');
  if(tdNom) tdNom.style.color = colorR;
  const btn = tr.querySelector('button[onclick^="recaudarPedido"]');
  if(btn){
    btn.className = `btn ${r.recaudado?'btn-tertiary':'btn-ghost'} btn-sm`;
    btn.innerHTML = `<span class="ms">${r.recaudado?'check_circle':'payments'}</span>${r.recaudado?'Recaudado':'Recaudo'}`;
  }
  // Sincronizar el checkbox de RECIBIDO con el estado real (evita que quede a medias)
  const cbRec = tr.querySelector('input[onchange*="updRecibido"]');
  if(cbRec) cbRec.checked = !!r.recibido;
  // Sincronizar el checkbox de INCLUIR DEUDA
  const cbDeu = tr.querySelector('input[onchange*="toggleIncluirDeuda"]');
  if(cbDeu) cbDeu.checked = !!r.incluirDeuda;
  // Actualizar los inputs numéricos SIN pisar el que el usuario está editando ahora
  const activo = document.activeElement;
  const setInput = (campo) => {
    const inp = tr.querySelector(`input[onchange*="updRec('${id}','${campo}'"]`);
    if(inp && inp !== activo) inp.value = (Number(r[campo])||0);
  };
  ['nequi','bancolombia','deudaPago','debeCliente','deuda','faltante','salida'].forEach(setInput);
  const celEfe = tr.querySelector('td.num.bold');
  if(celEfe) celEfe.textContent = money(r.efectivo);
  // Repintar la celda Cartera (columna 4) con el saldo actualizado del cliente.
  const saldoCart = r.clienteId ? getSaldoCliente(r.clienteId) : 0;
  const tdCart = tr.children[3];
  if(tdCart){
    tdCart.innerHTML = saldoCart<0
      ? `<span style="background:#ba1a1a;color:#fff;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap">Debe ${money(-saldoCart)}</span>`
      : saldoCart>0
      ? `<span style="background:#004b98;color:#fff;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap">Le debo ${money(saldoCart)}</span>`
      : `<span class="muted" style="font-size:11px">Al día</span>`;
  }
  // Repintar la celda Estado (columna 14) también.
  const tdEstado = tr.children[13];
  if(tdEstado){
    tdEstado.innerHTML = r.deuda>0
      ? `<span class="badge badge-error">Debe</span>`
      : r.debeCliente>0
      ? `<span class="badge badge-warn">Le debo</span>`
      : `<span class="badge badge-success">Al día</span>`;
  }
}
function _repintarTotalesRecaudo(){
  const filas = Object.values(DB.recaudo[_recaudoFecha]||{});
  const conf = filas.filter(f=>f.recibido);
  // EFECTIVO del día = efectivo de los pedidos + deudas pagadas EN EFECTIVO
  // (si un registro viejo tiene deudaPago sin medio, se asume efectivo)
  const tEfe = conf.reduce((a,b)=>{
    let e = (Number(b.efectivo)||0);
    const medio = b.deudaPagoMedio || (Number(b.deudaPago)>0 ? 'efectivo' : null);
    if(medio === 'efectivo') e += (Number(b.deudaPago)||0);
    return a + e;
  },0);
  // NEQUI del día = nequi de pedidos + deudas pagadas por nequi (el nequi ya incluye ambos)
  const tNeq = conf.reduce((a,b)=>a+(Number(b.nequi)||0),0);
  const tBan = conf.reduce((a,b)=>a+(Number(b.bancolombia)||0),0);
  // PAGOS DEUDAS = todo lo abonado a deudas viejas (efectivo + transferencia)
  const tDeu = conf.reduce((a,b)=>a+(Number(b.deudaPago)||0),0);
  const tRec = filas.filter(f=>f.recaudado).reduce((a,b)=>a+(b.subtotal||0),0);
  const kpis = document.querySelectorAll('#view .grid.grid-4 .kpi .kpi-v');
  if(kpis[0]) kpis[0].textContent = money(tEfe);
  if(kpis[1]) kpis[1].textContent = money(tNeq);
  if(kpis[2]) kpis[2].textContent = money(tBan);
  if(kpis[3]) kpis[3].textContent = money(tDeu);
  // TOTAL GENERAL = efectivo + nequi + bancolombia (el deudaPago YA está dentro de cada medio,
  // no se suma aparte para evitar el doble conteo).
  // Total Recaudado (botón) + deudas incluidas con el checkbox de la columna Deuda
  let extraDeudas = 0;
  for(const f of filas){
    if(f.incluirDeuda){
      const sd = f.clienteId ? getSaldoCliente(f.clienteId) : 0;
      if(sd < 0) extraDeudas += Math.abs(sd);   // el cliente debe → suma
      else if(sd > 0) extraDeudas -= sd;         // yo le debo → resta
    }
  }
  const fills = document.querySelectorAll('#view .kpi-fill .kpi-v');
  if(fills[0]) fills[0].textContent = money(tEfe + tNeq + tBan);
  if(fills[1]) fills[1].textContent = money(tRec + extraDeudas);
  // Resumen del día
  const bruto = filas.reduce((a,b)=>a+(b.subtotal||0),0);
  const confMonto = conf.reduce((a,b)=>a+(b.subtotal||0),0);
  const falt = filas.reduce((a,b)=>a+(b.faltante||0),0)+filas.reduce((a,b)=>a+(b.salida||0),0);
  const set = (id,v)=>{ const el=document.getElementById(id); if(el) el.textContent = money(v); };
  set('res-bruto', bruto);
  set('res-conf', confMonto);
  set('res-falt', falt);
  set('res-desdeu', tDeu);
}
function recaudarPedido(id){

  setTimeout(()=>{ const el=document.getElementById('rld-monto'); if(el){ el.focus(); el.select(); } }, 60);
}
function recibidoLeDeboConfirm(pedidoId, medio){
  const r = DB.recaudo[_recaudoFecha] && DB.recaudo[_recaudoFecha][pedidoId]; if(!r) return;
  const monto = Number(document.getElementById('rld-monto').value)||0;
  if(monto<=0){ toast('Ingresa un monto válido','error'); return; }
  // Restar del medio elegido (es un descuento en la factura del día)
  if(medio==='nequi'){
    r.nequi = Math.max(0,(Number(r.nequi)||0) - monto);
  } else if(medio==='bancolombia'){
    r.bancolombia = Math.max(0,(Number(r.bancolombia)||0) - monto);
  } else {
    // efectivo: usamos debeCliente que ya reduce en la fila
    r.debeCliente = (Number(r.debeCliente)||0) + monto;
  }
  // En cartera: baja lo que yo le debo al cliente
  if(r.clienteId) registrarMovCartera(r.clienteId,'debo_cliente',-monto,`Descuento le debo (${medio}) ${_recaudoFecha}`);
  r.recibido = true;
  recalcEfectivoFila(r);
  saveDB(); _encolarRecaudo(r); _repintarFilaRecaudo(pedidoId); _repintarTotalesRecaudo();
  closeModal();
  toast(`Descontado ${money(monto)} de ${medio}`,'success');
}
function updRec(id,campo,val){
  const r = DB.recaudo[_recaudoFecha] && DB.recaudo[_recaudoFecha][id]; if(!r) return;
  r[campo] = (campo==='entregado'||campo==='recibido'||campo==='observacion') ? val : (parseNum(val));
  // Si se escribe directo en la columna PAGO DEUDA, asumimos efectivo (para que sume en efectivo).
  if(campo==='deudaPago'){
    r.deudaPagoMedio = (r[campo] > 0) ? (r.deudaPagoMedio || 'efectivo') : null;
  }
  recalcEfectivoFila(r);
  if(['deuda','deudaPago','debeCliente'].includes(campo) && r.clienteId){
    const lastKey = '_last_' + campo;
    const last = r[lastKey] || 0;
    const delta = r[campo] - last;
    if(delta !== 0){
      if(campo==='deuda') registrarMovCartera(r.clienteId,'deuda',delta,`Deuda delivery ${_recaudoFecha}`);
      if(campo==='deudaPago') registrarMovCartera(r.clienteId,'pago_deuda',delta,`Pago deuda ${_recaudoFecha}`);
      if(campo==='debeCliente') registrarMovCartera(r.clienteId,'debo_cliente',delta,`Le debo cliente ${_recaudoFecha}`);
      r[lastKey] = r[campo];
    }
  }
  saveDB();
  _encolarRecaudo(r);
  // Si cambió una deuda, repintar TODAS las filas del mismo cliente (su cartera cambió).
  if(['deuda','deudaPago','debeCliente'].includes(campo) && r.clienteId){
    Object.values(DB.recaudo[_recaudoFecha]||{}).forEach(otra=>{
      if(otra.clienteId===r.clienteId) _repintarFilaRecaudo(otra.pedidoId);
    });
  } else {
    _repintarFilaRecaudo(id);
  }
  _repintarTotalesRecaudo();
}

async function descontarClienteRecaudo(pedidoId){
  const fecha = _recaudoFecha;
  const ped = DB.pedidos.find(p=>p.id===pedidoId && p.fecha===fecha);
  if(!ped){ toast('Pedido no encontrado para esta fecha','error'); closeModal(); return; }
  const monto = 10000;
  ped.total = Math.max(0, (Number(ped.total)||0) - monto);
  try{ await appwriteService.editarPedido(ped.id, {total: ped.total}); }catch(e){}
  await sincronizarRecaudoDia(fecha);
  const r = DB.recaudo[fecha] && DB.recaudo[fecha][pedidoId];
  if(r){ recalcEfectivoFila(r); _encolarRecaudo(r); }  // el subtotal ya bajó -> afecta efectivo, bruto y totales
  saveDB();
  const cli = DB.clientes.find(c=>c.id===ped.clienteId);
  toast(`-${money(monto)} aplicado a ${cli?cli.nombre:'pedido'}`, 'success');
  closeModal();
  entrarRecaudo();   // re-sincroniza y repinta con los totales ya actualizados
}
