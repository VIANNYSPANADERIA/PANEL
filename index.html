/* ===================== CARTERA ===================== */
function getSaldoCliente(clienteId){
  const movs = DB.cartera.filter(m=>m.clienteId===clienteId);
  return movs.length?movs[movs.length-1].saldoActual:0;
}
async function registrarMovCartera(clienteId,tipo,valor,observacion=''){
  const v = Number(valor)||0;
  if(v===0) return;
  const salAnt = getSaldoCliente(clienteId);
  let nv = salAnt;
  if(tipo==='deuda') nv = salAnt - v;
  if(tipo==='debo_cliente') nv = salAnt + v;
  if(tipo==='pago'||tipo==='pago_deuda') nv = salAnt + v;
  if(tipo==='pago_empresa') nv = salAnt - v;
  if(tipo==='saldo_inicial'||tipo==='ajuste') nv = v;
  const mov = {id:uid('M'),clienteId,fecha:isoDate(new Date()),tipo,valor:v,saldoAnterior:salAnt,saldoActual:nv,observacion};
  DB.cartera.push(mov);
  appwriteService.guardarMovCartera(mov).catch(()=>{});
}

function calcularPagoFinal(e){
  const totalDias = e.periodo==='semanal'?6:e.periodo==='quincenal'?15:30;
  const dias = Object.values(e.calendario||{}).filter(Boolean).length;
  const salProp = totalDias>0?(e.salarioBase/totalDias)*dias:0;
  const adel = (e.adelantos||[]).reduce((a,b)=>a+b.valor,0);
  const pend = (e.pendientes||[]).filter(p=>p.estado==='Pendiente').reduce((a,b)=>a+b.valor,0);
  return Math.max(0, salProp - adel - pend);
}

let _calNomYear = null, _calNomMonth = null, _calNomEmp = null;
function abrirCalendario(empId){
  const e=DB.nomina.empleados.find(x=>x.id===empId);
  if(!e) return;
  const today=new Date();
  // Al abrir un empleado distinto, arrancamos en el mes actual.
  if(_calNomEmp !== empId || _calNomYear === null){
    _calNomYear = today.getFullYear();
    _calNomMonth = today.getMonth();
    _calNomEmp = empId;
  }
  const y=_calNomYear, m=_calNomMonth;
  const first=new Date(y,m,1); const last=new Date(y,m+1,0).getDate();
  const dias = ['D','L','M','M','J','V','S'];
  const MES = new Date(y,m,1).toLocaleDateString('es-CO',{month:'long',year:'numeric'});
  modal(`Calendario - ${e.nombre} (${e.periodo})`,`
    <div class="flex fb mb-md" style="align-items:center">
      <button class="btn btn-ghost btn-sm" onclick="calNomNav('${empId}',-1)"><span class="ms">arrow_back</span></button>
      <div class="bold" style="text-transform:capitalize">${MES}</div>
      <button class="btn btn-ghost btn-sm" onclick="calNomNav('${empId}',1)"><span class="ms">arrow_outward</span></button>
    </div>
    <div class="cal">${dias.map(d=>`<div class="cal-day cal-head">${d}</div>`).join('')}${Array(first.getDay()).fill('<div class="cal-day" style="visibility:hidden"></div>').join('')}${Array.from({length:last},(_,i)=>{const day=i+1;const worked=e.calendario[`${y}-${m}-${day}`];return `<div class="cal-day ${worked?'worked':''}" onclick="toggleDay('${empId}',${y},${m},${day})">${day}</div>`}).join('')}</div>
    <div class="mt-md kpi kpi-fill"><div class="kpi-ico"><span class="ms">payments</span></div><div class="kpi-l">A pagar (días marcados)</div><div class="kpi-v">${money(calcularPagoFinal(e))}</div></div>
    <div class="muted mt-md">Click en un día para marcar/desmarcar. Usa las flechas para cambiar de mes.</div>
  `);
}
function calNomNav(empId, dir){
  _calNomMonth += dir;
  if(_calNomMonth < 0){ _calNomMonth = 11; _calNomYear--; }
  if(_calNomMonth > 11){ _calNomMonth = 0; _calNomYear++; }
  abrirCalendario(empId);
}
async function toggleDay(empId,y,m,day){
  const e=DB.nomina.empleados.find(x=>x.id===empId);
  if(!e) return;
  const k=`${y}-${m}-${day}`;
  e.calendario[k]=!e.calendario[k];
  saveDB();
  renderNomina();        // <- la tabla de fondo (dias, descuentos, A pagar) se actualiza YA
  abrirCalendario(empId);// <- y el modal se redibuja con el dia marcado
  try{ await appwriteService.editarEmpleado(empId, {calendario: e.calendario}); }
  catch(err){ e.calendario[k]=!e.calendario[k]; saveDB(); renderNomina(); abrirCalendario(empId); }
}

async function pagarNomina(id){
  const e=DB.nomina.empleados.find(x=>x.id===id);
  const dias=Object.values(e.calendario).filter(Boolean).length;
  const adel=(e.adelantos||[]).reduce((a,b)=>a+b.valor,0);
  const pend=(e.pendientes||[]).filter(p=>p.estado==='Pendiente');
  const pendVal=pend.reduce((a,b)=>a+b.valor,0);
  const pago=calcularPagoFinal(e);
  const entry={id:uid('NH'),empId:id,fecha:todayKey(),base:e.salarioBase,dias,adelantos:adel,pendientes:pendVal,pagado:pago};
  pend.forEach(p=>p.estado='Descontado');
  e.adelantos=[]; e.calendario={};
  try{
    await appwriteService.guardarPagoNomina(entry, {pendientes:e.pendientes, adelantos:e.adelantos, calendario:e.calendario});
    saveDB(); closeModal();renderNomina();toast('Pago de nómina registrado','success');
  }catch(err){ toast('No se pudo registrar el pago','error'); }
}

/* ===================== ESTADÍSTICAS (Chart.js) ===================== */
let _estYear = new Date().getFullYear();
let _charts = [];

/** Destruye los gráficos anteriores: sin esto Chart.js deja canvas huérfanos (memory leak). */
function destruirGraficos(){
  _charts.forEach(c=>{ try{ c.destroy(); }catch(e){} });
  _charts = [];
}

/** Crea un gráfico o muestra "sin datos" si no hay nada que mostrar. */
function mkChart(id, config, hayDatos){
  const cv = document.getElementById(id);
  if(!cv) return;
  if(!hayDatos){
    cv.parentElement.innerHTML = '<div class="chart-empty">Sin datos todavía</div>';
    return;
  }
  _charts.push(new Chart(cv.getContext('2d'), config));
}

const EST_COLORS = ['#3525cd','#00897b','#f9a825','#e53935','#8e24aa','#1e88e5','#43a047','#fb8c00','#6d4c41','#546e7a','#d81b60','#00acc1'];
/** Opciones base. Se construyen NUEVAS en cada llamada: Chart.js muta el objeto
    de opciones, y compartir una misma referencia entre gráficos los corrompe. */
function estOpts(extra){
  return Object.assign({
    responsive:true,
    maintainAspectRatio:false,
    plugins:{
      legend:{labels:{color:'#000', font:{weight:'700'}}},
      tooltip:{callbacks:{label:c=>` ${c.dataset.label||c.label}: ${money(c.parsed.y ?? c.parsed)}`}}
    },
    scales:{
      x:{ticks:{color:'#000',font:{weight:'600'}}, grid:{display:false}},
      y:{ticks:{color:'#000',font:{weight:'600'},callback:v=>money(v)}, grid:{color:'#e5e7eb'}}
    }
  }, extra||{});
}

function pintarGraficos(){
  if(typeof Chart === 'undefined'){ toast('No se pudo cargar la librería de gráficos','error'); return; }
  destruirGraficos();

  const movs   = DB.conta.movimientos || [];
  const year   = _estYear;
  const MESES  = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const delAno = movs.filter(m=>String(m.fecha||'').startsWith(year+'-'));

  const ingMes = MESES.map((_,i)=>delAno.filter(m=>m.tipo==='Ingreso' && Number(String(m.fecha).slice(5,7))===i+1).reduce((a,b)=>a+(Number(b.valor)||0),0));
  const gasMes = MESES.map((_,i)=>delAno.filter(m=>m.tipo==='Gasto'   && Number(String(m.fecha).slice(5,7))===i+1).reduce((a,b)=>a+(Number(b.valor)||0),0));

  /* 1 — Ingresos vs Gastos por mes */
  mkChart('g1', {
    type:'bar',
    data:{ labels:MESES, datasets:[
      {label:'Ingresos', data:ingMes, backgroundColor:'#00897b', borderRadius:6},
      {label:'Gastos',   data:gasMes, backgroundColor:'#e53935', borderRadius:6}
    ]},
    options: estOpts()
  }, delAno.length>0);

  /* 2 — Balance acumulado */
  let acc = 0;
  const balAcum = MESES.map((_,i)=>{ acc += ingMes[i]-gasMes[i]; return acc; });
  mkChart('g2', {
    type:'line',
    data:{ labels:MESES, datasets:[{label:'Balance acumulado', data:balAcum, borderColor:'#3525cd',
      backgroundColor:'rgba(53,37,205,.12)', fill:true, tension:.35, pointRadius:4, borderWidth:3}]},
    options: estOpts()
  }, delAno.length>0);

  /* 3 — Gastos por categoría */
  const catsG = [...new Set(movs.filter(m=>m.tipo==='Gasto').map(m=>m.categoria||'Sin categoría'))];
  const valsG = catsG.map(c=>movs.filter(m=>m.tipo==='Gasto' && (m.categoria||'Sin categoría')===c).reduce((a,b)=>a+(Number(b.valor)||0),0));
  mkChart('g3', {
    type:'doughnut',
    data:{ labels:catsG, datasets:[{data:valsG, backgroundColor:EST_COLORS, borderWidth:2, borderColor:'#fff'}]},
    options:{ responsive:true, maintainAspectRatio:false, cutout:'55%',
      plugins:{ legend:{position:'right', labels:{color:'#000',font:{weight:'700'},boxWidth:12}},
                tooltip:{callbacks:{label:c=>` ${c.label}: ${money(c.parsed)}`}} } }
  }, catsG.length>0);

  /* 4 — Ingresos por categoría */
  const catsI = [...new Set(movs.filter(m=>m.tipo==='Ingreso').map(m=>m.categoria||'Sin categoría'))];
  const valsI = catsI.map(c=>movs.filter(m=>m.tipo==='Ingreso' && (m.categoria||'Sin categoría')===c).reduce((a,b)=>a+(Number(b.valor)||0),0));
  mkChart('g4', {
    type:'pie',
    data:{ labels:catsI, datasets:[{data:valsI, backgroundColor:[...EST_COLORS].reverse(), borderWidth:2, borderColor:'#fff'}]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{position:'right', labels:{color:'#000',font:{weight:'700'},boxWidth:12}},
                tooltip:{callbacks:{label:c=>` ${c.label}: ${money(c.parsed)}`}} } }
  }, catsI.length>0);

  /* 5 — Saldo por cuenta */
  const ctas = DB.conta.cuentas || [];
  mkChart('g5', {
    type:'bar',
    data:{ labels:ctas.map(c=>c.nombre), datasets:[{label:'Saldo', data:ctas.map(c=>Number(c.saldo)||0),
      backgroundColor:ctas.map((_,i)=>EST_COLORS[i%EST_COLORS.length]), borderRadius:6}]},
    options: estOpts({ indexAxis:'y',
      scales:{ x:{ticks:{color:'#000',font:{weight:'600'},callback:v=>money(v)},grid:{color:'#e5e7eb'}},
               y:{ticks:{color:'#000',font:{weight:'700'}},grid:{display:false}} },
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c=>` ${c.label}: ${money(c.parsed.x)}`}} } })
  }, ctas.length>0);

  /* 6 — Top 10 productos más vendidos (por unidades) */
  const unidades = {};
  (DB.pedidos||[]).forEach(p=>(p.items||[]).forEach(it=>{
    const n = it.nombre || 'Producto';
    unidades[n] = (unidades[n]||0) + (Number(it.cantidad)||0);
  }));
  const top = Object.entries(unidades).sort((a,b)=>b[1]-a[1]).slice(0,10);
  mkChart('g6', {
    type:'bar',
    data:{ labels:top.map(t=>t[0]), datasets:[{label:'Unidades', data:top.map(t=>t[1]),
      backgroundColor:'#3525cd', borderRadius:6}]},
    options: estOpts({ indexAxis:'y',
      scales:{ x:{ticks:{color:'#000',font:{weight:'600'},precision:0},grid:{color:'#e5e7eb'}},
               y:{ticks:{color:'#000',font:{weight:'700'}},grid:{display:false}} },
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c=>` ${c.label}: ${c.parsed.x} und.`}} } })
  }, top.length>0);

  /* 7 — Ventas de los últimos 30 días */
  const dias=[], ventas=[];
  for(let i=29;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    dias.push(key.slice(8,10)+'/'+key.slice(5,7));
    ventas.push((DB.pedidos||[]).filter(p=>p.fecha===key).reduce((a,b)=>a+(Number(b.total)||0),0));
  }
  mkChart('g7', {
    type:'line',
    data:{ labels:dias, datasets:[{label:'Ventas del día', data:ventas, borderColor:'#f9a825',
      backgroundColor:'rgba(249,168,37,.18)', fill:true, tension:.3, pointRadius:2, borderWidth:2}]},
    options: estOpts()
  }, ventas.some(v=>v>0));
}

function _csvCell(v){
  v = String(v==null?'':v);
  if(/[",;\n\r]/.test(v)) v = '"' + v.replace(/"/g,'""') + '"';
  return v;
}
function _csvDownload(filename, rows){
  const csv = rows.map(r => r.map(_csvCell).join(';')).join('\r\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}
function exportarContaCSV(){
  const movs = DB.conta.movimientos;
  if(movs.length===0){ toast('No hay movimientos para exportar','error'); return; }
  const f = DB.facturaConfig;
  const hoy = new Date().toLocaleString('es-CO');
  const ing = movs.filter(m=>m.tipo==='Ingreso').reduce((a,b)=>a+b.valor,0);
  const gas = movs.filter(m=>m.tipo==='Gasto').reduce((a,b)=>a+b.valor,0);
  const bal = ing - gas;
  const rows = [];
  rows.push([f.nombreNegocio || 'ERP Panaderia']);
  rows.push(['NIT:', f.nit || '']);
  rows.push(['Telefono:', f.telefono || '']);
  rows.push(['Direccion:', f.direccion || '']);
  rows.push(['REPORTE DE CONTABILIDAD']);
  rows.push(['Generado:', hoy]);
  rows.push([]);
  rows.push(['#','Fecha','Tipo','Categoria','Descripcion','Valor','Ingresos','Gastos']);
  movs.forEach((m,i)=>{
    rows.push([
      i+1, m.fecha, m.tipo, m.categoria, m.descripcion,
      m.valor,
      m.tipo==='Ingreso'?m.valor:'',
      m.tipo==='Gasto'?m.valor:''
    ]);
  });
  rows.push([]);
  rows.push(['','','','','TOTALES','', '','',]);
  rows.push(['','','','','Ingresos totales','', ing, '', ]);
  rows.push(['','','','','Gastos totales','', '', gas, ]);
  rows.push(['','','','','Balance','', '', '', '']);
  rows.push(['','','','','BALANCE GENERAL','', bal, '', ]);
  _csvDownload(`contabilidad_${hoy.replace(/[\/: ,]/g,'-')}.csv`, rows);
  toast('CSV exportado','success');
}
function exportarFlujoCSV(){
  const movs = DB.conta.movimientos;
  if(movs.length===0){ toast('No hay movimientos para exportar','error'); return; }
  const f = DB.facturaConfig;
  const year = new Date().getFullYear();
  const hoy = new Date().toLocaleString('es-CO');
  const mesesN=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const rows = [];
  rows.push([f.nombreNegocio || 'ERP Panaderia']);
  rows.push(['FLUJO DE CAJA ANUAL', year]);
  rows.push(['Generado:', hoy]);
  rows.push([]);
  rows.push(['Mes','Ingresos','Gastos','Balance','Rentabilidad %']);
  let totIng=0, totGas=0;
  mesesN.forEach((mn,i)=>{
    const mi = movs.filter(m=>m.fecha.startsWith(year+'-') && Number(m.fecha.slice(5,7))===i+1 && m.tipo==='Ingreso').reduce((a,b)=>a+b.valor,0);
    const mg = movs.filter(m=>m.fecha.startsWith(year+'-') && Number(m.fecha.slice(5,7))===i+1 && m.tipo==='Gasto').reduce((a,b)=>a+b.valor,0);
    totIng += mi; totGas += mg;
    rows.push([mn, mi, mg, mi-mg, mi+mg>0?Math.round((mi-mg)/(mi+mg)*100):0]);
  });
  rows.push(['TOTAL ANUAL', totIng, totGas, totIng-totGas, totIng+totGas>0?Math.round((totIng-totGas)/(totIng+totGas)*100):0]);
  _csvDownload(`flujo_caja_${year}.csv`, rows);
  toast('CSV Flujo exportado','success');
}

    <div class="field"><label>Observación / Origen del dinero</label><input id="adc-obs" placeholder="Ej: Aporte de capital, préstamo, venta en efectivo..."/></div>
  `,`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="addDineroCuenta()">Agregar Dinero</button>`);
}
async function addDineroCuenta(){
  const cuenta = DB.conta.cuentas.find(c=>c.id===$('#adc-cuenta').value);
  const v = Number($('#adc-val').value)||0;
  if(!cuenta){ toast('Seleccione una cuenta','error'); return; }
  if(v<=0){ toast('Ingrese un monto válido','error'); return; }
  cuenta.saldo = (Number(cuenta.saldo)||0) + v;
  const t={id:uid('AP'),fecha:$('#adc-fecha').value,origen:'(Aporte de dinero)',destino:cuenta.nombre,valor:v,observacion:$('#adc-obs').value||'Aporte de dinero'};
  try{
    await appwriteService.guardarTransferencia(t);
    await appwriteService.editarCuenta(cuenta.id, {saldo:cuenta.saldo});
    saveDB(); closeModal(); renderConta(); toast(`${money(v)} agregados a ${cuenta.nombre}`,'success');
  }catch(e){ toast('No se pudo agregar el dinero','error'); }
}

/* ═══════════════════════════════════════════════════════════════════════════
 * MÓDULO CALENDARIO — eventos fijos (anuales) y temporales (un día)
 * ═══════════════════════════════════════════════════════════════════════════ */
let _calYear = new Date().getFullYear();
let _calMonth = new Date().getMonth();   // 0-11
let _calSelDay = null;

const CAL_MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const CAL_DIAS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const CAL_CATEGORIAS = ['General','Pago','Cobro','Producción','Compra','Cumpleaños','Festivo','Recordatorio','Reunión'];
const CAL_COLORS = ['#3525cd','#fe932c','#006e4b','#ba1a1a','#d6006e','#004b98','#7b1fa2','#00838f','#e65100','#2e7d32'];

function _cal2(n){ return String(n).padStart(2,'0'); }
function _calKey(y,m,d){ return `${y}-${_cal2(m+1)}-${_cal2(d)}`; }        // fecha completa
function _calMesDia(m,d){ return `${_cal2(m+1)}-${_cal2(d)}`; }             // mes-día (para fijos)

/* Eventos que aplican a una fecha concreta: temporales de esa fecha + fijos de ese mes-día */
function calEventosDe(y,m,d){
  const fecha = _calKey(y,m,d);
  const md = _calMesDia(m,d);
  const dia2 = _cal2(d);   // solo el día, para eventos mensuales
  return (DB.calendario||[]).filter(e =>
    (e.tipo==='temporal' && e.fecha===fecha) ||           // un solo día
    (e.tipo==='fijo' && e.mesdia===md) ||                 // anual: mismo día y mes
    (e.tipo==='mensual' && (e.diames===dia2 ||            // mensual: mismo día, cualquier mes
      (e.mesdia && e.mesdia.slice(3)===dia2)))            // compat con eventos guardados antes
  ).sort((a,b)=> (a.hora||'99').localeCompare(b.hora||'99'));
}

function renderCalendario(){
  setHeader('Calendario');
  const primero = new Date(_calYear, _calMonth, 1);
  let offset = primero.getDay() - 1; if(offset<0) offset=6;   // lunes=0
  const diasMes = new Date(_calYear, _calMonth+1, 0).getDate();
  const hoy = new Date();
  const esHoy = (d)=> hoy.getFullYear()===_calYear && hoy.getMonth()===_calMonth && hoy.getDate()===d;

  let celdas = '';
  for(let i=0;i<offset;i++) celdas += `<div class="cal-cell cal-empty"></div>`;
  for(let d=1; d<=diasMes; d++){
    const evs = calEventosDe(_calYear,_calMonth,d);
    const chips = evs.slice(0,3).map(e=>
      `<div class="cal-chip" style="background:${e.color}" title="${e.titulo}">${e.hora?`<b>${e.hora}</b> `:''}${e.titulo}${(e.tipo==='fijo'||e.tipo==='mensual')?' ↻':''}</div>`
    ).join('');
    const mas = evs.length>3 ? `<div class="cal-more">+${evs.length-3} más</div>` : '';
    celdas += `
      <div class="cal-cell ${esHoy(d)?'cal-today':''}" onclick="calDiaModal(${d})">
        <div class="cal-daynum">${d}${esHoy(d)?' <span class="cal-hoy">hoy</span>':''}</div>
        <div class="cal-chips">${chips}${mas}</div>
      </div>`;
  }

  const totalFijos = (DB.calendario||[]).filter(e=>e.tipo==='fijo').length;
  const totalMensual = (DB.calendario||[]).filter(e=>e.tipo==='mensual').length;
  const totalTemp = (DB.calendario||[]).filter(e=>e.tipo==='temporal').length;

  $('#view').innerHTML = `
    <div class="ph">
      <div><h1>Calendario</h1><div class="sub">Anuales, mensuales y temporales · ${totalFijos} anuales · ${totalMensual} mensuales · ${totalTemp} temporales</div></div>
      <div class="h-spacer"></div>
      <button class="btn btn-primary" onclick="calEventoModal()"><span class="ms">add</span>Nuevo evento</button>
    </div>
    <div class="cal-toolbar">
      <button class="btn btn-ghost" onclick="calNav(-1)"><span class="ms">arrow_back</span></button>
      <div class="cal-title">${CAL_MESES[_calMonth]} ${_calYear}</div>
      <button class="btn btn-ghost" onclick="calNav(1)"><span class="ms">arrow_outward</span></button>
      <button class="btn btn-ghost btn-sm" onclick="calHoy()"><span class="ms">calendar_month</span>Hoy</button>
    </div>
    <div class="cal-grid-head">${CAL_DIAS.map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="cal-grid">${celdas}</div>
    <div class="cal-legend">
      <span><span class="cal-dot" style="background:#3525cd"></span> ↻ = evento fijo (se repite cada año)</span>
    </div>`;
}

function calNav(dir){
  _calMonth += dir;
  if(_calMonth<0){ _calMonth=11; _calYear--; }
  if(_calMonth>11){ _calMonth=0; _calYear++; }
  renderCalendario();
}
function calHoy(){ const h=new Date(); _calYear=h.getFullYear(); _calMonth=h.getMonth(); renderCalendario(); }

/* Modal con todos los eventos de un día + botón para agregar */
function calDiaModal(d){
  _calSelDay = d;
  const evs = calEventosDe(_calYear,_calMonth,d);
  const fechaLbl = `${d} de ${CAL_MESES[_calMonth]} de ${_calYear}`;
  const lista = evs.length===0
    ? '<div class="empty">Sin eventos este día.</div>'
    : evs.map(e=>`
      <div class="cal-ev-row" style="border-left:5px solid ${e.color}">
        <div style="flex:1">
          <div class="bold">${e.hora?`<span style="color:${e.color}">${e.hora}</span> · `:''}${e.titulo}
            ${e.tipo==='fijo'?'<span class="badge" style="background:'+e.color+';color:#fff">Anual ↻</span>':''}
            ${e.tipo==='mensual'?'<span class="badge" style="background:'+e.color+';color:#fff">Mensual ↻</span>':''}
            <span class="badge">${e.categoria}</span>
          </div>
          ${e.nota?`<div class="muted" style="font-size:12px;margin-top:2px">${e.nota}</div>`:''}
        </div>
        <button class="btn btn-ghost btn-sm" onclick="calEventoModal('${e.id}')"><span class="ms">edit</span></button>
        <button class="btn btn-danger btn-sm" onclick="calDelEvento('${e.id}',${d})"><span class="ms">delete</span></button>
      </div>`).join('');

  modal(fechaLbl, `
    <div class="mb-md">${lista}</div>
    <button class="btn btn-primary" style="width:100%" onclick="calEventoModal(null,${d})"><span class="ms">add</span>Agregar evento a este día</button>
  `, `<button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>`);
}

/* Modal de creación/edición de un evento */
function calEventoModal(id, dia){
  const ev = id ? (DB.calendario||[]).find(e=>e.id===id) : null;
  const d = dia || _calSelDay || new Date().getDate();
  const fechaDefault = _calKey(_calYear,_calMonth,d);

  modal(id?'Editar evento':'Nuevo evento', `
    <div class="field"><label>Título *</label><input id="cv-titulo" value="${ev?ev.titulo:''}" placeholder="Ej: Pago arriendo, Cumpleaños de..."/></div>
    <div class="gf">
      <div class="field"><label>Tipo de evento</label>
        <select id="cv-tipo" onchange="calTipoPreview()">
          <option value="temporal" ${!ev||ev.tipo==='temporal'?'selected':''}>Temporal (un solo día)</option>
          <option value="mensual" ${ev&&ev.tipo==='mensual'?'selected':''}>Mensual (mismo día de cada mes)</option>
          <option value="fijo" ${ev&&ev.tipo==='fijo'?'selected':''}>Anual (mismo día y mes cada año)</option>
        </select></div>
      <div class="field"><label>Categoría</label>
        <select id="cv-cat">${CAL_CATEGORIAS.map(c=>`<option ${ev&&ev.categoria===c?'selected':''}>${c}</option>`).join('')}</select></div>
    </div>
    <div class="gf">
      <div class="field"><label>Fecha</label><input id="cv-fecha" type="date" value="${ev&&ev.fecha?ev.fecha:fechaDefault}"/></div>
      <div class="field"><label>Hora (opcional)</label><input id="cv-hora" type="time" value="${ev?ev.hora:''}"/></div>
    </div>
    <div class="field"><label>Nota (opcional)</label><textarea id="cv-nota" rows="2" placeholder="Detalles del evento...">${ev?ev.nota:''}</textarea></div>
    <div class="field"><label>Color</label>
      <div class="cal-colors">${CAL_COLORS.map(c=>`<span class="cal-color-opt ${(ev?ev.color:CAL_COLORS[0])===c?'sel':''}" style="background:${c}" onclick="calPickColor('${c}')" data-c="${c}"></span>`).join('')}</div>
      <input type="hidden" id="cv-color" value="${ev?ev.color:CAL_COLORS[0]}"/>
    </div>
    <div id="cv-preview" class="muted" style="font-size:12px;margin-top:6px"></div>
  `, `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="calGuardarEvento('${id||''}')">Guardar</button>`);
  calTipoPreview();
}

function calPickColor(c){
  const el = document.getElementById('cv-color'); if(el) el.value=c;
  document.querySelectorAll('.cal-color-opt').forEach(o=>o.classList.toggle('sel', o.dataset.c===c));
}
function calTipoPreview(){
  const tipo = document.getElementById('cv-tipo')?.value;
  const el = document.getElementById('cv-preview'); if(!el) return;
  el.innerHTML = tipo==='fijo'
    ? '↻ Este evento aparecerá <b>todos los años</b> en la misma fecha (mismo mes y día).'
    : tipo==='mensual'
    ? '↻ Este evento aparecerá el <b>mismo día de todos los meses</b> (ej: el 5 de cada mes).'
    : 'Este evento aparecerá <b>solo en la fecha seleccionada</b>.';
}

async function calGuardarEvento(id){
  const titulo = document.getElementById('cv-titulo').value.trim();
  if(!titulo){ toast('El título es obligatorio','error'); return; }
  const tipo = document.getElementById('cv-tipo').value;
  const fecha = document.getElementById('cv-fecha').value;
  if(!fecha){ toast('Selecciona una fecha','error'); return; }
  const partes = fecha.split('-');   // yyyy-mm-dd
  const data = {
    titulo,
    tipo,
    fecha,
    mesdia: `${partes[1]}-${partes[2]}`,   // mm-dd para los eventos anuales (fijo)
    diames: partes[2],                      // dd para los eventos mensuales
    hora: document.getElementById('cv-hora').value,
    nota: document.getElementById('cv-nota').value.trim(),
    categoria: document.getElementById('cv-cat').value,
    color: document.getElementById('cv-color').value
  };
  try{
    await appwriteService.guardarEvento(id?{id,...data}:data);
    saveDB(); closeModal(); renderCalendario(); toast('Evento guardado','success');
  }catch(e){ /* toast ya mostrado */ }
}

function calDelEvento(id, dia){
  const ev = (DB.calendario||[]).find(e=>e.id===id);
  modal('Eliminar evento', `<p>¿Eliminar <b>${ev?ev.titulo:'este evento'}</b>?${ev&&ev.tipo==='fijo'?' Dejará de aparecer todos los años.':''}</p>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-danger" onclick="calDelEventoOk('${id}',${dia||'null'})">Eliminar</button>`);
}
async function calDelEventoOk(id, dia){
  try{
    await appwriteService.eliminarEvento(id);
    saveDB(); closeModal(); renderCalendario();
    toast('Evento eliminado','success');
  }catch(e){ /* toast ya mostrado */ }
}

}
